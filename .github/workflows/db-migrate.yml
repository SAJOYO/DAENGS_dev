name: DB 마이그레이션 적용

# `db/migrations/*.sql` 한 장을 **서버 DB 에 적용**합니다. Actions 탭에서 손으로 돌립니다.
#
# 왜 필요한가 — 서버 PC 에는 SSH 도 SMB 도 없습니다(README). 그래서 마이그레이션을
# 적용하려면 그 앞에 가서 psql 을 쳐야 했는데, `place-search-ingest` 처럼 self-hosted
# 러너로 `docker compose exec` 를 돌릴 수 있으므로 **Actions 탭이 원격 손**이 됩니다.
#
# ⚠️ **작업 트리를 안 건드립니다.** 여기가 이 워크플로의 핵심입니다 —
#    `backend/src` 가 컨테이너에 bind mount 돼 있어서, 기능 브랜치를 checkout 하면
#    **그 순간 backend 가 그 코드를 로드합니다.** 마이그레이션을 적용하기 전에 새
#    모델이 올라오면 없는 컬럼을 SELECT 해서 `/app/pets` 같은 멀쩡한 경로가 500 이
#    됩니다. 그래서 checkout 은 기본 브랜치 그대로 두고, SQL 파일만 `git show` 로 꺼냅니다.
#
# ⚠️ **`run:` 블록은 전부 ASCII 입니다. 한글을 넣지 마세요.**
#    러너는 스텝 스크립트를 BOM 없는 UTF-8 로 쓰는데 Windows PowerShell 5.1 이 그것을
#    cp949 로 읽습니다. 한글이 깨지면서 따옴표가 안 닫히면 **파싱 단계에서 죽습니다** —
#    2026-09-04 에 실제로 그렇게 실패했습니다 (`"pgvector 가 안 뜹니다"` 가
#    `"pgvector 媛<NUL> ???밸땲??"` 로 깨져 문자열이 안 닫혔습니다).
#    `deploy.yml` 은 run 블록에 한글이 있는데도 도는데, 그건 그 글자들이 우연히 안
#    깨진 것뿐이라 기대면 안 됩니다. 같은 `workflow_dispatch` 인 인제스트 워크플로
#    둘(`place-search-ingest` · `territory-sites-ingest`)은 run 블록이 **전부 ASCII**
#    입니다 — 그쪽을 따릅니다. 설명은 이렇게 YAML 주석으로 답니다(스크립트에 안 들어감).
#
# ⚠️ **바이트를 PowerShell 파이프에 태우지 마세요.** SQL 에는 한글 주석과
#    `COMMENT ON ... IS '한글'` 이 들어 있고 pg_dump 는 아예 바이너리입니다.
#    PowerShell 은 파이프를 지날 때 다시 인코딩합니다 — SQL 은 주석이 깨지고, 덤프는
#    통째로 못 쓰게 되며 **복원할 때까지 그걸 모릅니다.** 그래서 파일을 옮기는 자리는
#    `shell: cmd`(리다이렉션이 바이트 그대로)와 `docker cp` 를 씁니다.
#    같은 함정이 `docs/deploy/runbook.md` §2 에도 적혀 있습니다.
#
# ⚠️ **여러 번 돌려도 안전해야 합니다.** 이 저장소는 버전 테이블이 없어서 DB 가 적용
#    여부를 기억하지 않습니다 — 모든 마이그레이션이 `IF NOT EXISTS` · `DO` 블록으로
#    멱등하게 쓰여 있습니다 (db/migrations/README.md).

on:
  workflow_dispatch:
    inputs:
      file:
        description: "db/migrations/ 안의 파일 이름 (예: 2026-09-04_pet_photo.sql)"
        required: true
        type: string
      ref:
        description: "그 파일을 꺼내 올 브랜치·커밋. 아직 안 머지된 PR 브랜치도 됩니다"
        required: true
        default: dev
        type: string
      verify:
        description: "적용 뒤 verify_<파일> 도 돌려서 결과를 로그에 남깁니다"
        required: false
        default: true
        type: boolean
      backup:
        description: "적용 전에 pg_dump 를 뜹니다 (이 DB 는 자동 백업이 없습니다)"
        required: false
        default: true
        type: boolean

concurrency:
  # 마이그레이션이 겹치면 안 됩니다. 배포와 달리 **취소하지 않습니다** —
  # 반쯤 적용된 채로 끊기는 것이 제일 나쁩니다.
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.file }} 적용
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    # 입력을 스크립트에 문자열로 끼워 넣지 않고 **환경 변수**로 넘깁니다 (스크립트 주입 방지).
    env:
      MIG_FILE: ${{ inputs.file }}
      MIG_REF: ${{ inputs.ref }}
      MIG_VERIFY: ${{ inputs.verify }}
      BACKUP_DIR: C:\deploy\daengs\db-backups

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5
        with:
          # 서버 전용 .env 와 빌드 산출물을 지우지 않습니다 (deploy.yml 과 같은 이유).
          clean: false

      # 파일 **이름만** 받습니다. 경로 구분자를 막아 db/migrations 밖으로 못 나갑니다.
      - name: Validate input
        shell: powershell
        run: |
          if ($env:MIG_FILE -notmatch '^[A-Za-z0-9._-]+\.sql$') {
            throw "bad file name: $env:MIG_FILE (name only, no path separators)"
          }
          if ($env:MIG_FILE -like 'verify_*') {
            throw "do not run verify_ files directly; pass the base name and enable verify"
          }
          if ($env:MIG_REF -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]*$') {
            throw "bad ref: use a branch, tag or commit without shell metacharacters"
          }
          Write-Host "file=$env:MIG_FILE ref=$env:MIG_REF"

      # ⚠️ checkout 하지 않습니다 (맨 위 bind mount 주석). `git show` 로 파일만 꺼냅니다.
      #    cmd 를 쓰는 이유는 리다이렉션이 **바이트 그대로**이기 때문입니다 —
      #    PowerShell 로 받으면 SQL 안의 한글 주석이 다시 인코딩됩니다.
      - name: Fetch migration SQL
        shell: cmd
        run: |
          if exist _migrate rmdir /s /q _migrate
          mkdir _migrate || exit 1
          git fetch origin %MIG_REF% --depth=1 || exit 1
          git show FETCH_HEAD:db/migrations/%MIG_FILE% > _migrate\%MIG_FILE% || exit 1
          for %%F in (_migrate\%MIG_FILE%) do if %%~zF EQU 0 exit 1
          if /I "%MIG_VERIFY%"=="true" (
            git show FETCH_HEAD:db/migrations/verify_%MIG_FILE% > _migrate\verify_%MIG_FILE% || exit 1
            for %%F in (_migrate\verify_%MIG_FILE%) do if %%~zF EQU 0 exit 1
          )
          dir _migrate

      - name: Wait for database
        shell: powershell
        run: |
          docker compose up -d pgvector
          $ok = $false
          foreach ($i in 1..20) {
            docker compose exec -T pgvector sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' | Out-Null
            if ($?) { $ok = $true; break }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "pgvector did not become ready" }
          Write-Host "pgvector ready"

      # ⚠️ **이 DB 는 자동 백업이 없습니다.** pg_dump 는 GCP 이관 때 손으로 한 번 뜬 것이
      #    전부입니다(roadmap §2). 마이그레이션은 덧붙이기만 하도록 쓰지만, 그 규칙을
      #    어긴 파일이 하나 섞이면 되돌릴 방법이 없습니다.
      #
      # ⚠️ 덤프는 **체크아웃 폴더 밖**에 둡니다. 안에 두면 언젠가 `git clean -ffdx` 가
      #    지웁니다 — 크롤러 코퍼스가 실제로 그렇게 날아갔고, deploy.yml 이
      #    `clean: false` 를 쓰는 이유가 그것입니다.
      #
      # ⚠️ **옛 백업을 자동으로 지우지 않습니다.** 연달아 돌리면 제일 오래된 것부터
      #    밀려 나가는데, 크게 되돌려야 할 때 필요한 것이 바로 그 "아무것도 안 바뀐
      #    상태" 의 백업입니다. 목록만 보여 주고, 지우는 판단은 사람이 합니다.
      - name: Backup (pg_dump)
        if: ${{ inputs.backup }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:BACKUP_DIR | Out-Null

          Write-Host "--- database size ---"
          docker compose exec -T pgvector sh -c 'psql -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_size_pretty(pg_database_size(current_database()))"'
          Write-Host "--- disk free ---"
          Get-PSDrive C | Select-Object Used, Free | Format-List

          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $out = Join-Path $env:BACKUP_DIR "vectordb-$stamp.dump"

          # -Fc is binary: build it inside the container, then docker cp it out.
          docker compose exec -T pgvector sh -c 'pg_dump -Fc -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /tmp/migrate-backup.dump'
          if ($LASTEXITCODE -ne 0) { throw "pg_dump failed - aborting before any change" }
          docker cp pgvector:/tmp/migrate-backup.dump $out
          if ($LASTEXITCODE -ne 0) { throw "docker cp failed - aborting before any change" }
          docker compose exec -T pgvector rm -f /tmp/migrate-backup.dump

          $size = (Get-Item $out).Length
          if ($size -lt 1024) { throw "dump too small ($size bytes) - aborting" }

          # pg_dump custom format starts with the magic bytes "PGDMP".
          # If the binary ever goes through a text pipe again, this catches it.
          $magic = [System.Text.Encoding]::ASCII.GetString([byte[]](Get-Content $out -Encoding Byte -TotalCount 5))
          if ($magic -ne 'PGDMP') { throw "not a pg_dump archive (magic='$magic') - aborting" }

          Write-Host "backup ok: $out ($([math]::Round($size/1MB,1)) MB)"
          Write-Host "restore: docker cp <file> pgvector:/tmp/r.dump then pg_restore"
          Write-Host "note: roles are NOT in this dump - see runbook globals.sql"

          $dumps = @(Get-ChildItem $env:BACKUP_DIR -Filter 'vectordb-*.dump' | Sort-Object LastWriteTime -Descending)
          $total = ($dumps | Measure-Object -Property Length -Sum).Sum
          Write-Host "--- kept backups: $($dumps.Count) (total $([math]::Round($total/1GB,2)) GB) ---"
          $dumps | ForEach-Object { Write-Host ("  {0}  {1} MB" -f $_.Name, [math]::Round($_.Length/1MB,1)) }
          if ($dumps.Count -gt 5) {
            Write-Host "::warning::$($dumps.Count) backups kept. Delete old ones by hand: $env:BACKUP_DIR"
          }

      # `<` 리다이렉션이 **바이트 그대로**라 SQL 안의 한글이 안 깨집니다.
      # ON_ERROR_STOP=1 이라 한 줄이라도 실패하면 여기서 멈춥니다.
      # 계정·DB 이름은 컨테이너 안 환경 변수를 씁니다 — 워크플로에 안 적습니다.
      - name: Apply
        shell: cmd
        run: |
          docker compose exec -T pgvector sh -c "psql -X -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"" < _migrate\%MIG_FILE% || exit 1
          echo applied: %MIG_FILE%

      # 새 verify는 불일치 시 예외를 내고 psql 실패를 전파합니다.
      # 기존 출력 전용 verify는 여전히 결과를 사람이 확인해야 합니다.
      - name: Verify
        if: ${{ inputs.verify }}
        shell: cmd
        run: |
          if not exist _migrate\verify_%MIG_FILE% exit 1
          for %%F in (_migrate\verify_%MIG_FILE%) do if %%~zF EQU 0 exit 1
          docker compose exec -T pgvector sh -c "psql -X -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"" < _migrate\verify_%MIG_FILE% || exit 1

      - name: Clean up
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force _migrate -ErrorAction SilentlyContinue

