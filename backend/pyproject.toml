[project]
name = "daengs-backend"
version = "0.1.0"
description = "DAENGS 백엔드 API"
readme = "README.md"
authors = [
    { name = "choiyc05", email = "choiyc05@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "joserfc>=1.7.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

# uv run dev / uv run run 으로 부릅니다.
# 각각 fastapi dev / fastapi run 과 같은 설정입니다.
[project.scripts]
dev = "daengs_backend.main:dev"
run = "daengs_backend.main:run"
# 관리자 계정 INSERT SQL 을 만들어 줍니다. DB 는 건드리지 않습니다.
seed-admin = "daengs_backend.cli.seed_admin:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# uv run pytest 로 부릅니다. 테스트는 backend/tests/ 에 둡니다
# (패키지 안이 아니라 밖입니다 — 배포 아티팩트에 테스트가 들어가지 않게).
[tool.pytest.ini_options]
testpaths = ["tests"]
# async 테스트에 @pytest.mark.asyncio 를 매번 붙이지 않아도 되게 합니다.
# 지금은 async 테스트가 없지만, DB·API 카드부터 바로 필요합니다.
asyncio_mode = "auto"
