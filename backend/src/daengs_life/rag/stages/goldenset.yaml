  # ------------------------------------------------------------------ 지자체 지원 3 (origin: hand)
  # RAG-033 로 조례 208건이 들어오면서 추가한 문항이다. 앞의 7문항과 성격이 하나 다르다 —
  # **정답이 지자체마다 따로 있다.** 법령은 전국에 하나라 "제15조"가 유일한 정답이지만, 조례는
  # 같은 취지의 조가 135개 지자체에 흩어져 있어 "빠지면 답이 틀리는 청크"를 하나로 못 집는다.
  #
  # 그래서 must 는 **그 지자체를 명시한 질문**에만 건다. "우리 동네" 류를 must 로 만들면 라벨이
  # 사실상 임의 선택이 되고, Recall 이 모델 차이가 아니라 뽑기 운을 재게 된다. 지역을 안 밝힌
  # 질문의 채점은 이 파일이 아니라 검문소④(답변이 지역을 되묻는지)가 맡는다.
  #
  # 이 셋이 실제로 보려는 것은 **`trust_level` 이 답에서 구분되는가**다 (카드 #39 ③).
  # 조례(`law`)와 지자체 안내문(`official`)은 근거의 무게가 다른데, 지금 코퍼스에는 조례만
  # 있어 이 축이 아직 시험되지 않는다. `benefit24-services` 가 들어오면 그때 성립한다.

  - id: S1
    added_on: 2026-08-27
    origin: hand
