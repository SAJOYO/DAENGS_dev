name: Walk diary runtime

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [Configure, Check, Prepare, Start, Stop, Smoke, Backfill]
        default: Check
        required: true
      latitude:
        type: string
        default: '37.4878'
      longitude:
        type: string
        default: '127.052'
      radius:
        type: string
        default: '1200'
      regional_smoke:
        description: 'Two synthetic walks using distinct managed region caches'
        type: boolean
        default: false
      backfill_mode:
        type: choice
        options: [Preview, Apply, Migrate, Smoke]
        default: Preview
      backfill_scope:
        description: 'JSON object: walk_id OR since/until; optional after, limit (1..10)'
        type: string
      backfill_plan:
        type: string

permissions:
  contents: read
concurrency:
  group: walk-diary-runtime
  cancel-in-progress: false

jobs:
  operate:
    if: ${{ inputs.operation != 'Smoke' && inputs.operation != 'Backfill' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      WALK_OPERATION: ${{ inputs.operation }}
      WALK_LATITUDE: ${{ inputs.latitude }}
      WALK_LONGITUDE: ${{ inputs.longitude }}
      WALK_RADIUS: ${{ inputs.radius }}
      WALK_SGIS_KEY: ${{ secrets.WALK_SGIS_KEY }}
      WALK_SGIS_SECRET: ${{ secrets.WALK_SGIS_SECRET }}
      WALK_PUBLIC_DATA_KEY: ${{ secrets.WALK_PUBLIC_DATA_KEY }}
    steps:
      # No checkout: live backend/src is a bind mount. Operate only on the deployed commit.
      - name: Operate on the existing deployment
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw 'Deploy this exact commit first; runtime control never checks out live source'
          }
          git diff --quiet HEAD -- tools/walk-diary-runtime.ps1 tools/walk_runtime_smoke.py backend/.env.walk-public.example docker-compose.yml backend/src db/migrations
          if ($LASTEXITCODE -ne 0) { throw 'Runtime source has local changes; inspect them first' }
          $culture = [Globalization.CultureInfo]::InvariantCulture
          $lat = [double]::Parse($env:WALK_LATITUDE, $culture)
          $lng = [double]::Parse($env:WALK_LONGITUDE, $culture)
          $radius = [int]::Parse($env:WALK_RADIUS, $culture)
          & .\tools\walk-diary-runtime.ps1 -Action $env:WALK_OPERATION -Latitude $lat -Longitude $lng -Radius $radius

  smoke:
    if: ${{ inputs.operation == 'Smoke' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      WALK_REGIONAL_SMOKE: ${{ inputs.regional_smoke }}
    steps:
      # Only the probe is copied. Feature-branch checks must not replace live backend/src.
      - uses: actions/checkout@v5
        with:
          path: _walk-runtime-smoke
          clean: false
      - name: Probe the running application with a disposable account
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Live checkout is missing' }
          Write-Host ('Tested server source: ' + $head)
          $source = Join-Path $env:GITHUB_WORKSPACE '_walk-runtime-smoke\tools\walk_runtime_smoke.py'
          $target = '/tmp/walk-runtime-smoke-' + $env:GITHUB_RUN_ID + '.py'
          try {
            docker cp $source ('daengs-backend:' + $target)
            if ($LASTEXITCODE -ne 0) { throw 'Probe copy failed' }
            $arguments = @('exec', '-w', '/app', 'daengs-backend', 'uv', 'run', '--no-sync', 'python', $target, '--execute')
            if ($env:WALK_REGIONAL_SMOKE -eq 'true') { $arguments += '--regional' }
            & docker @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Walk runtime probe failed' }
          } finally {
            docker exec daengs-backend rm -f $target
          }

  backfill:
    if: ${{ inputs.operation == 'Backfill' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      BACKFILL_MODE: ${{ inputs.backfill_mode }}
      BACKFILL_SCOPE: ${{ inputs.backfill_scope }}
      BACKFILL_PLAN: ${{ inputs.backfill_plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: _walk-backfill
          clean: false
      - name: Preview or recover missing public context
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE '_walk-backfill/tools/walk-context-backfill.ps1'
          $scope = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:BACKFILL_SCOPE)) {
            $value = ConvertFrom-Json $env:BACKFILL_SCOPE
            if ($value -isnot [pscustomobject]) { throw 'Scope must be a JSON object' }
            $names = @{since='Since'; until='Until'; after='After'; walk_id='WalkId'; limit='Limit'}
            foreach ($field in $value.PSObject.Properties) {
              if (-not $names.ContainsKey($field.Name)) { throw 'Unknown scope field' }
              $scope[$names[$field.Name]] = $field.Value
            }
          }
          & $script -LiveRoot $env:GITHUB_WORKSPACE -Mode $env:BACKFILL_MODE -ExpectedPlan $env:BACKFILL_PLAN @scope
