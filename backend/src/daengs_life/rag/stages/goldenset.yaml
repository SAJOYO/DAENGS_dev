      # **이 문항은 소관기관명을 제목에 붙인 처방(RAG-034 ⑥)의 판정 문항이다** — 붙이기 전에는
      # 사업명이 그냥 `취약계층 반려동물 의료비 지원` 이라 1위가 **충청북도** 것이었다
