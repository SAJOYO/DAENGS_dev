# 시험 ③ 답할까·되물을까·넘길까 — 3분류. 사전 등록 (수집 전에 동결).
#
# 왜 (2026-09-11): dev D-068 이 General 에 되묻기(ask)를 넣었다. 기존 양방향(답/넘김)에 되묻기 칸이 생겨
# 새 실패 둘이 이름을 얻는다 — 답할 수 있는데 되묻는 over_ask, 관찰도 없이 답하는 under_ask.
# 되묻기는 status=CLARIFY 로 코드가 읽는다(판정기 0). 응급은 라우터 앞 어휘 게이트가 vet_contact 로 끝내므로
# 코드 거절(emergency)로 읽는다 — "초콜릿이 왜 위험해요?" 가 여기 걸리면 과잉거절이고, 그건 모델이 아니라 사전 탓이다.
benchmark_id: deferral-ask-v1
related: [deferral pf_v1_1, emergency-gate v1]
frozen_at: 2026-09-11
author: gayeoniee + claude

inputs:
  questions: evals/profile_fitness/questions_pf_ask_v1.jsonl    # ask 10 · defer 6 · answer 4 (+ pf_v6_sub18 의 answer 18 을 같이 본다)
  expectations: evals/deferral/expectations_pf_ask_v1.jsonl     # review=true 3건은 사람 검토 전
  questions_sha256: 3edc2275a4d7e3acfbcf0f15e442e972051e93d4075d8ee33832570306a2a1a7
scope: {adapters: fallback-only, general_fallback: on, general_prompt: general-answer-ko-v6, condition: contrast}
judge:
