# api-locations.inc를 인증서나 GCP 호스트 없이 server 컨텍스트에서 검증하는 CI fixture.
# 운영에는 마운트하지 않습니다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=place_search_per_ip:10m rate=5r/s;

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8000;
    server_name _;

    include /etc/nginx/conf.d/api-locations.inc;
}
