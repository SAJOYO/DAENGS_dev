    dog:
      age_months: 1
    # **나이가 답을 뒤집는 자리.** 등록 의무는 월령 2개월부터라, 생후 1개월이면 지금은
    # 대상이 아니다(원하면 할 수는 있다). 프로필이 없으면 이 질문의 정답은 "2개월부터"라는
    # 일반론이고, 있으면 "아직 아니다"가 된다 — 답이 갈리는 것을 눈으로 볼 수 있다.
    must:
      # lap19 가 대안 둘을 더하게 했다 — **어느 것으로도 답이 성립한다** (RAG-055 의 "두 층").
