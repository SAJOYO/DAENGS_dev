services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: dog-rag-pgvector
    environment:
      POSTGRES_DB: dog_rag
      POSTGRES_USER: dog_rag
      POSTGRES_PASSWORD: dog_rag_local
    ports:
      - "5433:5432"
    volumes:
      - dog_rag_pgdata:/var/lib/postgresql/data
      - ./infra/pgvector/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dog_rag -d dog_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  dog_rag_pgdata:
