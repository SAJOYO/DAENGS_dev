# GCP 전용 오버레이 (D-042). 로컬 서버·개발 PC 는 이 파일을 쓰지 않습니다.
#
# 기동 (docs/deploy/runbook.md 의 절차 안에서):
#   docker compose -f docker-compose.yml -f docker-compose.gcp.yml --profile gait \
#     up -d nginx backend place-search journey-service gait-worker
#
# 크롤러(crawler-worker · crawler-beat)는 **일부러 목록에 없습니다** — GCP 에서는 Cloud Run 잡
# `corpus-refresh` 가 크롤~적재를 대신합니다 (D-062, docs/deploy/corpus-pipeline.md). 코퍼스 정본은
# 여전히 로컬 서버입니다. 단 compose 는 파일 해석 시점에 `:?` 가드를 평가하므로, 안 띄워도
# 최상단 .env 의 DAENGS_CORPUS_DIR 에는 더미 경로가 있어야 합니다 (runbook §2).
# ⚠ **서비스 이름을 빼고 `up -d` 하지 마세요** — profile 이 없는 크롤러까지 뜹니다 (#150).
#
# 트레이싱(D-054)을 켤 때는 **프로파일과 서비스 이름을 둘 다** 더합니다. 이 파일의
# 기동이 서비스를 명시 나열하는 방식이라, `--profile tracing` 만 붙이면 collector 가
# 목록에 없어서 안 뜨고 backend 는 아무 데도 못 보냅니다:
#
#   docker compose -f docker-compose.yml -f docker-compose.gcp.yml
#     --profile gait --profile tracing
#     up -d nginx backend place-search journey-service gait-worker otel-collector
#
# (한 줄로 이어 쓰세요 — 위는 읽기 좋게 끊어 둔 것입니다.)
services:
  nginx:
    ports:
      # 80·8000 은 base 에 이미 있습니다(ports 는 병합-추가). 8000 을 굳이 빼지 않는
      # 이유: 호스트의 Next(서버사이드 프록시, NEXT_PUBLIC_API_ORIGIN 기본값
      # 127.0.0.1:8000)가 씁니다. 바깥은 GCP 방화벽이 80/443 외 전부 막습니다.
      - "443:443"
    # volumes 는 병합하면 base 의 default.conf 와 겹치므로 통째로 바꿉니다.
    # gcp.conf 가 default.conf 자리를 대신합니다 — 80(ACME/리다이렉트) · 443 ×2 ·
    # 8000(호스트 내부용) 블록을 모두 담은 자립 파일입니다.
    volumes: !override
      - ./nginx/gcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/api-locations.inc:/etc/nginx/conf.d/api-locations.inc:ro
      # 인증서. named volume 이 아니라 호스트 경로인 이유: 발급·갱신을 compose 밖의
      # 일회성 certbot 컨테이너(docker run)로 하므로, 프로젝트 접두사가 붙는 named
      # volume 이름을 맞추는 것보다 경로 공유가 단순합니다.
      - /srv/daengs/letsencrypt:/etc/letsencrypt:ro

  # gait-worker (D-043) — `/app/gait/*` 의 실행부이자 이제 보행 분석의 **유일한** 실행부.
  # 여기에 **상한을 안 겁니다.**
  #
  # 옛 `gait-analysis`(HTTP)에는 `cpus: 2.5` 가 걸려 있었고 D-063 4단계에서 서비스와 함께
  # 지웠습니다. 그 값은 gait-analysis 를 실측해 나온 것이 아니라 "4vCPU 중 API 에 1.5 를
  # 남긴다"는 배분에서 나온 숫자였습니다. **워커에 같은 cap 을 옮겨 붙이지 않았습니다** —
  # HTTP 컨테이너의 cap 이 워커에도 맞다는 근거가 없고, GCP 의 보행 분석이 오래 걸리는 문제를
  # 보고 있는 중이라 CPU 제한은 성능에 직접 닿습니다. 워커 cap 은 실측 뒤 별도 결정입니다.
  #
  # 걸어야 할 때의 신호 — 분석 중 `/walk`·`/ask` 응답이 눈에 띄게 느려지거나, `docker stats`
  # 에서 gait-worker 가 3 vCPU 이상을 지속적으로 먹을 때. 그때 API 에 남길 몫을 정해 잡으세요.
  # gait-worker:
  #   cpus: 2.5
