name: walk entry v2 PostgreSQL
on:
  pull_request:
    paths:
      - 'backend/src/daengs_backend/**'
      - 'backend/src/daengs_walk/**'
      - 'backend/src/daengs_life/**'
      - 'backend/tests/walk/**'
      - 'backend/tests/conftest.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'db/**'
      - '.github/workflows/walk-entry-v2-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/daengs_backend/**'
      - 'backend/src/daengs_walk/**'
      - 'backend/src/daengs_life/**'
      - 'backend/tests/walk/**'
      - 'backend/tests/conftest.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'db/**'
      - '.github/workflows/walk-entry-v2-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: walk_pin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d walk_pin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WALK_PIN_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-password@127.0.0.1:5432/walk_pin_test
      # The storyboard fixture creates its own UUID schema in this disposable DB.
      LIVE_STORYBOARD_TEST_DSN: postgresql://postgres:test-password@127.0.0.1:5432/walk_pin_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Pin, photo, diary and storyboard storage
        run: >-
          uv run pytest -q -rs tests/walk/entries/test_walk_entry_v2_db.py
          tests/walk/entries/test_walk_entry_v2.py
          tests/walk/photos/test_walk_photo_db.py
          tests/walk/diary/test_diary_generation_db.py
          tests/walk/storyboard/test_walk_storyboard_db.py
          --junitxml=walk-entry-v2-results.xml
      - name: Require executed checks
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("walk-entry-v2-results.xml").iter("testcase"))
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Pin/photo/diary/storyboard DB verification had no tests or skipped cases")
          PY
