# The regular all-package suite remains unchanged. This job exercises actual PostgreSQL locks.
name: territory ownership DB

on:
  pull_request:
    paths:
      - "backend/src/daengs_backend/**"
      - "backend/tests/test_territory*"
      - "backend/tests/test_activity*"
      - "backend/tests/conftest.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "db/**"
      - ".github/workflows/territory-ownership-tests.yml"
  push:
    branches: [dev]
    paths:
      - "backend/src/daengs_backend/**"
      - "backend/tests/test_territory*"
      - "backend/tests/test_activity*"
      - "backend/tests/conftest.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "db/**"
      - ".github/workflows/territory-ownership-tests.yml"

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: claims_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d claims_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TERRITORY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-password@127.0.0.1:5432/claims_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q tests/test_activity_db.py tests/test_activity.py tests/test_territory_ownership_db.py tests/test_territory_ownership_api.py tests/test_territory_claim.py tests/test_territory_attempts.py tests/test_territory_vision.py
