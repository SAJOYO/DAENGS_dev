[project]
name = "daengs-gait-analysis"
version = "0.1.0"
description = "강아지 보행 영상 분석 — 관절 움직임 기록과 같은 개체의 시간 변화 비교. 진단이 아닙니다"
requires-python = ">=3.12,<3.13"

# ─────────────────────────────────────────────────────────────────
# 기본 = **화면과 계약만** 보는 데 필요한 것 (torch 없음).
#
#   uv sync                        → 이만큼. /healthz 와 스키마를 볼 수 있습니다
#   uv sync --extra model          → torch·ultralytics 까지 (~2GB). 진짜 추론용
#   uv sync --extra model --extra url   → URL 업로드까지
#
# skin-screening 과 같은 가름입니다 — 앱·백엔드 개발자는 응답 모양만 있으면 붙일 수
# 있고, 진짜 추론은 서버 한 대에서만 돌면 됩니다.
# ─────────────────────────────────────────────────────────────────
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # multipart 업로드 (FastAPI 가 런타임에 요구)
    "numpy>=1.26",
]

[project.optional-dependencies]
# 진짜 추론. 가중치는 이 저장소에 없습니다 — README 참고.
#
# ⚠️ 원본 walk_demo 의 `src/requirements.txt` 에는 없지만 import 체인 때문에
#    pandas·scipy·scikit-learn 이 따라오고 있었습니다. 실험 모듈이 module 최상단에서
#    그것들을 부르고 있었기 때문인데, **알고리즘에는 쓰이지 않습니다.**
#    상수·함수만 뽑아 src/config.py · gait_filter.py · feature_engine.py 로 재구성하면서
#    셋 다 빠졌습니다. 다시 넣지 마세요 — 넣어야 한다면 무엇이 그것을 부르는지부터 보세요.
model = [
    "torch>=2.2",
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "imageio-ffmpeg>=0.4",       # overlay 인코딩 · 업로드 mp4 변환 (정적 ffmpeg 바이너리)
]

# URL 로 영상을 받아오는 기능. **유지할지 아직 정하지 않았습니다** (README 의 TBD).
# 서비스가 앱 업로드만 받는다면 통째로 뺄 수 있어서 갈라 두었습니다.
url = [
    "yt-dlp>=2024.1",
    "curl_cffi>=0.6",            # 일부 사이트의 봇 차단 우회 (브라우저 impersonation)
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

# ─────────────────────────────────────────────────────────────────
# torch 를 어디서 받을지. backend/ · skin-screening/ 과 같은 장치입니다.
#
# ⚠️ **리눅스를 안 적으면 CUDA 판이 옵니다.** PyPI 의 기본 torch 휠은 NVIDIA 런타임을
#    동봉하고 있어서, 컨테이너가 GPU 를 안 쓰는데도 수 GB 를 받습니다.
#    compose 의 gait-analysis 가 리눅스라 여기가 실제로 물리는 자리입니다.
#
# Windows(개발 PC)는 마커에 안 걸려 PyPI 기본에서 받습니다.
# ─────────────────────────────────────────────────────────────────
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# src/ 는 `from src import ...` 로 경로에서 직접 임포트합니다 (serve.py 가 폴더 루트를
# sys.path 에 넣습니다). 설치 대상 패키지가 아니라 빌드하지 않습니다.
# ⚠️ backend/ 와 다른 레이아웃입니다 — skin-screening 과 같은 모양으로 맞췄습니다.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 가중치를 실제로 올리는 테스트는 기본 실행에서 뺍니다 — 없는 환경이 정상이기 때문입니다.
#   uv run pytest -m weights
markers = ["weights: 실제 모델 가중치가 있어야 도는 테스트"]
addopts = "-m 'not weights'"
