name: migration verification
on:
  pull_request:
    paths:
      - 'db/**'
      - '.github/workflows/db-migrate.yml'
      - '.github/workflows/migration-verification-tests.yml'
      - 'tools/check_migration_verification.py'
      - 'tools/check_migration_names.py'
  push:
    branches: [dev]
    paths:
      - 'db/**'
      - '.github/workflows/db-migrate.yml'
      - '.github/workflows/migration-verification-tests.yml'
      - 'tools/check_migration_verification.py'
      - 'tools/check_migration_names.py'
permissions:
  contents: read
jobs:
  # 이름과 짝만 봅니다. 내용 검사는 아래 두 job 이 합니다.
  #
  # **이 PR 이 건드린 파일만** 봅니다 — 폴더 전체에 걸면 verify 짝이 없는 옛 파일 여덟이
  # 첫날부터 빨간불입니다. 그 부채를 이 검사로 갚게 하지 않습니다
  # (`tools/check_migration_names.py` 첫 docstring).
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 바뀐 파일을 알려면 갈라진 지점까지 있어야 합니다. 얕은 클론이면
          # merge-base 가 안 잡혀 diff 가 통째로 나옵니다.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 바뀐 마이그레이션 파일 고르기
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # 지운 파일은 뺍니다(rename 은 만든 쪽만 보면 됩니다). 없으면 빈 값이고,
          # 스크립트는 인자가 없으면 그대로 통과합니다.
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD -- db/migrations | xargs)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - run: python tools/check_migration_names.py ${{ steps.changed.outputs.files }}
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-password
      PGDATABASE: migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_migration_verification.py sql
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_migration_verification.py windows
