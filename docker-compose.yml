services:
  nginx:
    image: nginx:1.31.1
    container_name: daengs-nginx
    restart: unless-stopped
    networks:
      - daengs-network
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # 컨테이너 안에서 호스트(이 PC)로 접속하기 위한 이름.
    # Docker Desktop 은 기본 제공하지만, 리눅스 서버에서도 동작하도록 명시해 둡니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgvector:
    image: pgvector/pgvector:pg18
    container_name: pgvector
    restart: unless-stopped
    networks:
      - daengs-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vectordb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 0.0.0.0 바인딩입니다. 같은 네트워크의 팀원이 붙을 수 있도록 의도한 것입니다.
      # 그래서 POSTGRES_PASSWORD 는 .env 에서 반드시 기본값이 아닌 값으로 지정하세요.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql:rw
      - ./db/init:/docker-entrypoint-initdb.d:ro
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vectordb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # GUI가 필요할 때만: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    networks:
      - daengs-network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin:rw
    depends_on:
      pgvector:
        condition: service_healthy

networks:
  daengs-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin-data:
