# ⚠ **이 워크플로는 돌지 않습니다.** `runs-on: ubuntu-latest` 인데, 이 팀은 GitHub 호스티드
# 러너를 쓰지 않기로 했습니다(비용 — 영구 결정). `self-hosted` 인 `db-migrate.yml`·`deploy.yml`
# 만 실제로 돕니다. 그래서 이 파일이 말하는 "PR 마다 전체 테스트" 와 아래 postgres 서비스는
# **아무도 실행하지 않는 설정**입니다 — 지금 백엔드 테스트는 사람이 로컬에서
# `cd backend && uv run pytest` 로 돌립니다 (`tests/place/**`·`test_facility_discovery_api.py`
# 는 `geoalchemy2` 미설치로 수집 단계에서 실패하니 그 둘은 빼고 돌리세요).
# **postgres 서비스는 지우지 않습니다** — 나중에 self-hosted 러너로 옮기면 그대로 켜질
# 자리이기 때문입니다. 옮길 때는 포트를 **5432 로 매핑하지 마세요** — 서버 PC 의 유일한
# pgvector 가 이미 5432 를 씁니다. 겹치면 팀 DB 컨테이너와 충돌합니다.
#
# 백엔드 전체 테스트 (#230).
#
# **`paths` 필터를 일부러 걸지 않습니다.** 이 워크플로가 생긴 이유가 정확히 "필터에 안 걸려서
# 안 돌았다" 이기 때문입니다 — `journey-tests.yml` · `place-search-tests.yml` 은 각자
# `daengs_journey` · `daengs_place` 경로에만 반응해서, 나머지 여섯 패키지
# (`daengs_backend` · `daengs_life` · `daengs_walk` · `daengs_training` · `daengs_screening` ·
# `daengs_gait`)는 한 번도 검사되지 않았습니다. `dev` 머지가 곧 배포라 그대로 나갔습니다.
# 필터를 다시 잡으면 새 패키지가 생길 때마다 같은 구멍이 재발합니다.
#
# 전체가 5분 안쪽이라 모든 PR 에서 돌려도 리뷰가 붙기 전에 끝납니다. 느려지면 그때
# 쪼개는 것을 봅니다 (PR #230 의 "남은 것" 참조 — 그때의 진짜 일감은 여러 패키지에
# 걸친 테스트 16개입니다).
#
# **postgres 서비스가 붙어 있습니다.** 대부분의 테스트는 가짜 리포지토리로 돌지만,
# 트리거·FK·인덱스는 가짜로 증명할 수 없습니다. 그 층(`test_pet_membership_postgres.py` ·
# `test_release_fk_postgres.py`)은 DSN 이 없으면 **조용히 skip** 되므로, 서비스를 떼면
# 검사가 사라진 것을 아무도 모릅니다.
name: backend tests

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 층 2 테스트(트리거·인덱스·마이그레이션 재실행)는 진짜 PostgreSQL 이 있어야
        # 돈다. 없으면 pytest.skip 으로 조용히 넘어가는데, 그 층이 지고 있는 것이
        # 개인정보 파기 보장이라 조용히 넘어가면 안 된다 (docs/co-care.md §5).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vectordb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: 스키마 적재
        working-directory: .
        run: |
          for f in $(ls db/init/*.sql | sort); do
            echo "== $f"
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d vectordb -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGPASSWORD: postgres
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # `--extra place` 가 **필수**입니다. 빼면 `tests/place` 12개 파일이
      # `No module named 'geoalchemy2'` 로 **수집 단계에서** 죽어 스위트가 통째로 안 돕니다
      # (`CLAUDE.md` 의 `uv sync --extra place` 와 같은 이유).
      #
      # **`ml`·`gait`·`screening` 그룹은 일부러 안 깝니다.** torch 만 2.4GB 라 CI 마다 받는 것이
      # 얻는 것에 비해 비쌉니다 (D-021 이 상주 비용을 다룬 것과 같은 판단). 그 그룹이 필요한
      # 테스트는 `pytest.importorskip` 으로 **skip 됩니다** — 없는 그룹은 실패가 아닙니다.
      #
      # `--extra agent` 는 D-055 ⑦ 입니다. 에이전트 구현을 조건부로 보존하기로 하면서, 보존하는
      # 코드를 아무도 검사하지 않는 상태를 막으려고 CI 에서만 깝니다 (LangChain 둘, 수십 MB).
      # 서버 backend 컨테이너는 여전히 안 깝니다.
      - name: 의존성
        run: uv sync --frozen --extra place --extra agent

      # 인자 없이 돌립니다. #224 이전에는 수집 단계에서 죽어 이것이 불가능했습니다.
      - name: 테스트
        run: uv run pytest -q
        env:
          DAENGS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vectordb

      # ruff 는 아직 켜지 않습니다. `daengs_journey`·`daengs_place` 는 각자 워크플로에서
      # 이미 검사하고, 나머지 패키지에는 기존 지적이 남아 있어 지금 켜면 첫날부터
      # 빨간불입니다. 그 정리는 별도 카드입니다 (PR #230 "남은 것").
