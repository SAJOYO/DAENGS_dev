[project]
name = "daengs-backend"
version = "0.1.0"
description = "DAENGS 백엔드 API"
readme = "README.md"
authors = [
    { name = "choiyc05", email = "choiyc05@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.5",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "google-cloud-run>=0.16.1",
    "google-cloud-storage>=2.18",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "joserfc>=1.7.4",
    "kiwipiepy>=0.23.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "lxml>=6.1.2",
    "openai>=3.8.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pgvector>=0.3",
    "pillow>=10.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.7",
    "pyyaml>=6.0.3",
    "redis>=6.0",
    "shapely>=2.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "tzdata>=2026.3",
]

# uv run dev / uv run run 으로 부릅니다.
# 각각 fastapi dev / fastapi run 과 같은 설정입니다.
[project.scripts]
dev = "daengs_backend.main:dev"
run = "daengs_backend.main:run"
# 저장소 규칙 검사. **3초** 안에 끝나는 것만 들어갑니다 — pytest 가 안 보는 자리
# (루트 `tools/` 의 마이그레이션 체커)를 봅니다. 느린 것을 넣지 마세요, 이유는 그 파일 첫머리에.
check = "daengs_backend.cli.check:main"
# 관리자 계정 INSERT SQL 을 만들어 줍니다. DB 는 건드리지 않습니다.
seed-admin = "daengs_backend.cli.seed_admin:main"
# 앱 없이 카카오 id_token 을 받아 우리 검증기로 확인합니다 (개발용).
kakao-token = "daengs_backend.cli.kakao_token:main"
# 코퍼스 파이프라인 — Cloud Run Job 이 부른다 (D-062). Celery 없이 crawl~load 를 한 프로세스에서.
corpus-refresh = "daengs_life.jobs.corpus_refresh:main"

[project.optional-dependencies]
place = [
    "alembic>=1.19",
    "geoalchemy2>=0.15",
]
# 로컬 전체 테스트는 `uv sync --extra place` 입니다. LangChain 에이전트 오케스트레이터
# (구 `orchestration/agent/`, `agent` extra) 는 D-072 로 지웠습니다 — LangGraph 와 재 본
# 결과가 정확도 우위 없이 토큰·지연만 약 두 배였고, 승인된 후속 기능 어디에도 "툴 결과를
# 보고 다음 수를 정하는 선택" 이 필요하지 않았습니다.

# torch 를 플랫폼별로 다른 인덱스에서 받는다 (개발 PC 는 RTX 3050, 서버 backend 컨테이너는 CPU).
# `explicit = true` 라 아래 [tool.uv.sources] 로 지목한 패키지만 이 인덱스에서 받는다.
#
# **리눅스를 안 적으면 CUDA 판이 온다.** PyPI 의 기본 torch 휠은 NVIDIA 런타임을 동봉하고
# 있어서, 마커가 win32 뿐이면 컨테이너가 GPU 를 안 쓰는데도 수 GB 를 받는다. D-021 로
# 서버에 torch 가 생기면서 실제로 물리는 자리가 됐다.
# `rtmlib` 이 `opencv-python`(GUI 빌드)을 **필수 의존성으로** 끌고 옵니다 (6단계 전에는
# `ultralytics` 도 그랬습니다). 그대로 두면 gait 그룹에 GUI 판과 headless 판이 **둘 다**
# 깔리고, 둘은 같은 `cv2` 네임스페이스를 다퉈서 어느 쪽이 로드될지 설치 순서에 달립니다.
# GUI 판이 이기면 컨테이너에서 `ImportError: libxcb.so.1` 로 죽습니다.
#
# override 로 headless 를 강제합니다 — 이 서비스는 창을 띄우지 않으므로 API 는 같습니다.
# ⚠ **`gait` 그룹의 `opencv-python-headless` 선언만 지우면 안 됩니다.** 그러면 rtmlib 이
#   다시 GUI 판을 끌고 옵니다. 이 override 와 그 선언이 한 쌍입니다.
[tool.uv]
# opencv 는 **headless 만** 들어옵니다 — GUI 판(opencv-python · opencv-contrib-python)은 어느 그룹이
# 끌고 와도 이 override 로 막힙니다. rtmlib 이 GUI 판을 요구하는데 slim 컨테이너에는 libxcb 가
# 없어 첫 분석에서 죽습니다 (2026-08-31 실측). 같은 버전·같은 API 입니다.
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
]

# `cardgen`(D-078)은 diffusers 가 huggingface-hub>=1.x 를 요구하고, `ml` 은 sentence-transformers →
# transformers<5 → huggingface-hub<1 에 묶여 한 해석에 같이 못 들어간다. 두 그룹을 한 venv·이미지에
# 같이 까는 곳이 없으므로(backend=ml·screening, pipeline 이미지=ml·pipeline·pdf, cardgen 이미지=cardgen 만)
# 서로 배타적인 그룹으로 선언한다. ⚠ 둘을 같이 설치하려 하면 uv 가 거부한다 — 그게 의도다.
conflicts = [
    [{ group = "ml" }, { group = "cardgen" }],
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
# ⚠️ torchvision 도 같이 지목해야 합니다 (D-040). torch 만 CPU 로 잡고 이걸 두면
#    torchvision 이 PyPI 기본에서 와서 NVIDIA 런타임을 다시 끌고 옵니다.
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# src/ 밑에 패키지가 여럿이라 이름을 적어 준다. 기본값은 프로젝트 이름에서 유추한
# `daengs_backend` 하나뿐이어서, 안 적으면 나머지 패키지가 **휠에서 조용히 빠진다**
# — 컨테이너가 `backend/src` 를 마운트해 도는 개발 모드에서는 안 드러난다.
[tool.uv.build-backend]
module-name = [
    "daengs_backend",
    "daengs_cardgen",
    "daengs_cardimage",
    "daengs_evals",
    "daengs_gait",
    "daengs_journey",
    "daengs_life",
    "daengs_place",
    "daengs_screening",
    "daengs_training",
    "daengs_walk",
]

[dependency-groups]
dev = [
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]
# 앱 런타임과 섞지 않으려고 그룹으로 뺀다. `uv sync --group ml` 을 해야 설치되고,
# **기본 `uv sync` 에는 안 붙는다** — 서버 backend 컨테이너가 torch 10GB 를 받으면 안 된다.
ml = [
    "numpy>=2",
    "pyarrow>=18",
    "sentence-transformers>=3.4",
    "torch>=2.6",
    "transformers<5",
]
# 보행 분석(D-038). **`ml` 과 겹치지 않는 독립 그룹**이다 — gait 컨테이너는
# `uv sync --frozen --group gait` 하나만 돌린다.
#
# `ml` 을 같이 붙이지 않는 이유: gait 소스가 쓰는 서드파티는 cv2 · imageio_ffmpeg ·
# numpy · onnxruntime · rtmlib · torch · torchvision 뿐이고, `ml` 의
# sentence-transformers · transformers · pyarrow 는 **하나도 쓰지 않는다.**
# 붙이면 gait 컨테이너가 임베딩 모델 스택을 통째로 더 받는다.
#
# torch 를 명시하는 이유: 아래 [tool.uv.sources] 의 인덱스 바인딩이 **패키지 단위**라,
# 어느 그룹이 요구하든 리눅스에서 CPU 판을 받는다는 것을 여기서 보이게 한다.
#
# **6단계에서 `ultralytics` 가 빠졌다** (D-063 6단계). legacy 추론 runtime
# (`pipeline`·`keypoint_infer`·`crop_assist`)을 지우면서 그것을 쓰던 유일한 두 모듈이
# 없어졌다. 옛 legacy **기록**은 그대로 읽고 비교한다 — 없어진 것은 새 legacy 분석을
# 실행하는 능력뿐이라 의존성이 필요 없다.
#
# ⚠ **compose 의 `uv sync` 인자와 이 이름이 어긋나면 gait-worker 가 기동에서 멈춘다** —
#   `--frozen` 이라 로그에 바로 나오지만, 웹은 멀쩡해서 상태 화면의 보행만 `absent` 로 보인다.
#   이름을 바꾸면 docker-compose.yml 의 gait-worker `command` 도 같이 고쳐라.
#
# ⚠ **`gait-venv` 를 `backend-venv` 와 공유하면 안 된다.** 인자 없는 `uv sync` 는 exact
#   동기화라 같은 볼륨에 돌리면 서로의 그룹을 지운다 (crawler-worker 주석과 같은 함정).
#
# **5B 부터 legacy·v4 두 엔진이 이 그룹 하나를 같이 쓴다** (D-063 5B). 옛 `gait-v4` 그룹의
# `==` 핀(골든이 나온 정확한 조합)이 여기로 들어와 `gait` 를 대체했다 — v4 골든
# (`backend/tests/test_gait_v4_golden.py`, 0.01px)이 **그 버전 조합에서** 나왔으므로,
# `torch`·`torchvision`·`numpy`·`opencv-python-headless`·`imageio-ffmpeg` 는 legacy 쪽 여유
# (`>=`)가 아니라 v4 쪽 정확한 버전(`==`)을 그대로 썼다 (5B 구현 시 실측: 병합해도
# 기존 lock 대비 버전 변경 0). `onnxruntime`·`rtmlib`·`opencv-contrib-python-headless` 는
# v4 전용이라 새로 추가됐다.
gait = [
    "imageio-ffmpeg==0.6.0",       # overlay 인코딩 · 업로드 mp4 변환 (정적 ffmpeg 바이너리)
    "numpy==2.5.2",
    "onnxruntime==1.29.0",         # v4 RTMPose ONNX 추론
    # ⚠ **`opencv-python` 이 아니라 `-headless` 입니다.** 전자는 GUI 빌드라 X11 공유
    #   라이브러리(libxcb·libGL 등)를 요구하는데 `python:3.12-slim` 컨테이너에는 없습니다.
    #   **개발 PC(Windows)에서는 절대 안 드러납니다** — 거기선 그 의존성이 필요 없어서
    #   테스트도 추론도 다 통과합니다. 서버 컨테이너에서 첫 분석 요청을 보내야만
    #   `ImportError: libxcb.so.1` 로 터집니다 (2026-08-31 실제로 겪음).
    #   `/healthz` 는 파일 존재만 보고 cv2 를 import 하지 않아 `ready:true` 로 멀쩡히
    #   나옵니다 — 그래서 기동만으로는 알 수 없습니다.
    #   이 서비스는 화면을 띄우지 않으므로 headless 로 충분합니다(API 동일).
    "opencv-contrib-python-headless==5.0.0.93",  # v4 rtmlib 이 요구 — [tool.uv] override 로 GUI 판은 막힘
    "opencv-python-headless==5.0.0.93",
    "rtmlib==0.0.16",              # v4 RTMPose 래퍼
    "torch==2.13.0",
    "torchvision==0.28.0",
]
# **AGPL 이라 그룹으로 가둔다** (RAG-032 ②). PyMuPDF 는 AGPL-3.0 이고, backend 이미지에
# 들어가면 서비스 전체가 그 조건을 안게 된다. 이 그룹은 **오프라인 파이프라인 전용**이다 —
# `rag parse` 가 개발 PC 에서 돌 때만 필요하고 서빙(`/ask`)은 파싱 결과만 읽는다.
#
# ⚠️ `docker-compose.yml` 의 backend `command` 가 `uv sync --frozen --group ml` 이라
# 이 그룹은 컨테이너에 안 깔린다. **그 줄에 `--group pdf` 를 더하면 격리가 깨진다.**
# 확인: `docker compose exec backend uv pip list | grep -i mupdf` 가 비어야 한다.
pdf = [
    "pymupdf>=1.28.2",
]

# 피부 스크리닝 (D-040). torch·numpy 는 위 `ml` 에 이미 있으므로 여기엔 그 위에
# 얹히는 것만 둡니다 — timm 은 모델 정의 모음이라 가볍습니다.
#
# ⚠️ **`docker-compose.yml` 의 backend `command` 에 `--group screening` 이 같이
#    있어야 합니다.** 빠뜨리면 `/screen/` 만 503 이 되는데 다른 API 는 멀쩡해서
#    로그에 아무 문제도 안 보입니다 (`pdf` 그룹 주석과 같은 함정).
#    확인: `docker compose exec backend uv pip list | grep -i timm` 가 비면 안 됩니다.
screening = [
    "timm>=1.0.9",
    "torchvision>=0.17",
    "pillow>=10.2",
    "pandas>=2.1",
    "tqdm>=4.66",
    "huggingface-hub>=0.34",
]
pipeline = [
    "google-cloud-run>=0.16.1",
]
# 실시간 산책·날씨 서비스(D-070)가 받는 것 전부. **base 의존성을 안 받는다** —
# `uv sync --frozen --only-group realtime --no-install-project` 로 깐다 (`gait-v4` 와 같은 방식).
#
# base 를 안 받는 이유 둘. ① base 에는 realtime 이 안 쓰는 것이 스무 개쯤 있고
# (sqlalchemy · celery · langgraph · kiwipiepy · shapely · google-genai …) **앞으로 늘어난다.**
# 다른 팀원이 base 에 무거운 것을 넣으면 이 이미지가 따라 커지는데 **그 사람은 모른다.**
# ② 그룹으로 적으면 **경계가 기계가 읽는 형태로 남는다** — 지금 "realtime 이 쓰는 것은 여섯"은
# import 전수 조사 결과일 뿐 어디에도 안 적혀 있었다. `gait` 그룹이 같은 논리로 만들어졌다.
#
# ⚠ **`tzdata` 는 코드가 직접 import 하지 않는다.** `zoneinfo.ZoneInfo("Asia/Seoul")` 이
#   간접적으로 쓴다 — 전수 조사에서 놓치기 쉬운 자리이고, 빠지면 import 는 되는데 시간대
#   조회에서 터진다.
# ⚠ **놓친 패키지는 빌드가 아니라 런타임 import 에서 터진다.** 그물이 둘 있다:
#   `uv sync --only-group realtime` 한 별도 venv 로 앱을 import 해 보는 것과,
#   이미지를 띄워 실제로 두 엔드포인트를 부르는 것 (docker/realtime/).
# ⚠ 이름을 바꾸면 `docker/realtime/Dockerfile` 의 `--only-group` 인자도 같이 고쳐라.
#   `--frozen` 이라 빌드가 바로 죽지만, 그때는 이미 Cloud Build 위다.
realtime = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=6.0",
    "tzdata>=2026.3",
]
# 도감 카드 생성 GPU 서비스(D-078)가 받는 것 전부. **base 의존성을 안 받는다** —
# `docker/cardgen/Dockerfile` 이 `uv sync --frozen --only-group cardgen --no-install-project` 로 깐다
# (`realtime` 그룹과 같은 이유). torch 는 여기서도 리눅스 CPU 판으로 잠기고, CUDA 판은 Dockerfile 이
# 덮어쓴다 — `[tool.uv.sources]` 를 풀지 말 것.
# ⚠ 이름을 바꾸면 `docker/cardgen/Dockerfile` 의 `--only-group` 인자도 같이 고쳐라.
cardgen = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "diffusers>=0.40",
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=0.34",
    "pillow>=10.2",
    "torch==2.13.0",
    "transformers>=4.57.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# uv run pytest 로 부릅니다. 테스트는 backend/tests/ 에 둡니다
# (패키지 안이 아니라 밖입니다 — 배포 아티팩트에 테스트가 들어가지 않게).
[tool.pytest.ini_options]
testpaths = ["tests"]
# **rootdir(=backend/)을 sys.path 에 넣습니다.** `tools/` 를 `daengs_evals` 로 승격하면서
# (#336) 원래 이 줄이 있던 이유(#224 — `from tools... import` 가 venv 에 안 깔린 패키지를
# 찾지 못함)는 없어졌지만, 줄을 지우고 돌려 보니 다른 이유로 여전히 필요했다: 여러 테스트가
# `tests/` 자체를 패키지처럼 써서 서로를 import 한다 —
# `tests/place/discovery/test_facility_actions.py` 가
# `from tests.place.support.discovery import make_service, request` 를,
# `tests/place/api/test_facility_discovery_api.py` 가 `from tests.place.support.session_store import
# MemorySessions` 를, `tests/walk/storyboard/test_storyboard_observations.py` 가
# `from tests.walk.support.storyboard import headings` 를 쓴다. `tests/` 에
# `__init__.py` 가 없어 이것들은 namespace 패키지로만 잡히는데, 그러려면 `backend/` 가
# sys.path 에 있어야 한다 — 지우면 `ModuleNotFoundError: No module named 'tests'`.
pythonpath = ["."]
# async 테스트에 @pytest.mark.asyncio 를 매번 붙이지 않아도 되게 합니다.
asyncio_mode = "auto"
# 가중치를 로드하는 테스트는 기본 실행에서 뺍니다 — bge-m3 하나가 6.5GB 라
# pytest 가 분 단위로 느려지면 아무도 안 돌립니다. 따로: `uv run pytest -m slow`
# (marker 가 없는 테스트는 `not slow` 를 통과하므로 나머지는 그대로 돕니다.)
markers = ["slow: 임베딩 모델 가중치를 실제로 로드한다"]
addopts = "-m 'not slow'"
