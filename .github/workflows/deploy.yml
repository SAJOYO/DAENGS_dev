name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch: # Actions 탭에서 수동 실행

# Runtime stop/recreate must finish before the next deployment begins.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_ROOT: 'C:\deploy\daengs'
  KEEP_RELEASES: 3 # 롤백용으로 남겨 둘 이전 릴리스 개수

jobs:
  deploy:
    name: 서비스 반영
    # 이 PC 에 등록한 self-hosted 러너에서 실행됩니다.
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5
        with:
          # 기본값(true)이면 git clean -ffdx 가 돌아서
          # node_modules 와 .next/cache 까지 지워집니다. 매번 콜드 빌드가 되므로 끕니다.
          clean: false
          # 직전 dev와의 diff로 재생성이 필요한 서비스만 고릅니다. workflow_dispatch는
          # 비교 기준이 없으므로 아래 단계에서 둘 다 재생성합니다.
          fetch-depth: 0

      - name: PM2 설치 확인
        run: |
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
            npm install -g pm2
          }
          pm2 -v

      - name: Migrate Walk settings to root env once
        run: |
          uv run --no-project --python 3.12 python tools/migrate_walk_root_env.py
          if ($LASTEXITCODE -ne 0) { throw 'Root env migration failed; deployment stopped' }

      - name: Compose 설정 검증
        run: |
          # backend의 필수 배포 환경변수가 비어 있으면 컨테이너를 바꾸기 전에 명확히 실패시킨다.
          $envPath = Join-Path $env:GITHUB_WORKSPACE 'backend\.env'
          if (-not (Test-Path $envPath)) { throw 'backend/.env not found' }
          $geminiLine = Get-Content $envPath | Where-Object { $_ -match '^\s*GEMINI_API_KEY\s*=' } | Select-Object -First 1
          if (-not $geminiLine) { throw 'GEMINI_API_KEY missing in backend/.env' }
          $env:GEMINI_API_KEY = ($geminiLine -replace '^\s*GEMINI_API_KEY\s*=\s*', '').Trim().Trim('"').Trim("'")
          if ([string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) { throw 'GEMINI_API_KEY empty in backend/.env' }
          Write-Output "::add-mask::$env:GEMINI_API_KEY"
          Add-Content -Path $env:GITHUB_ENV -Value "GEMINI_API_KEY=$env:GEMINI_API_KEY"
          docker compose config --quiet

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 빌드
        working-directory: frontend
        run: npm run build

      - name: 릴리스 폴더 구성
        run: |
          # 폴더 이름에 run_number 를 붙여 실행마다 새 폴더를 씁니다.
          # 해시만 쓰면 같은 커밋을 재배포할 때 $rel 이 "지금 서비스 중인 폴더"가 되고,
          # PM2 워커가 그 폴더를 cwd 로 붙잡고 있어 아래 Remove-Item 이 실패합니다.
          # (standalone server.js 가 기동하면서 자기 폴더로 chdir 합니다)
          $rel = Join-Path $env:DEPLOY_ROOT "releases\${{ github.sha }}-${{ github.run_number }}"
          if (Test-Path $rel) { Remove-Item $rel -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $rel | Out-Null

          # standalone 산출물 (server.js, .next, node_modules)
          Copy-Item "frontend\.next\standalone\*" $rel -Recurse -Force

          # standalone 에는 아래 둘이 포함되지 않으므로 직접 넣어 줘야
          # CSS 와 이미지가 정상적으로 서빙됩니다.
          Copy-Item "frontend\.next\static" "$rel\.next\static" -Recurse -Force
          Copy-Item "frontend\public"       "$rel\public"       -Recurse -Force

          Write-Host "릴리스 준비 완료: $rel"

      - name: current 링크 교체
        run: |
          $cur = Join-Path $env:DEPLOY_ROOT "current"
          $rel = Join-Path $env:DEPLOY_ROOT "releases\${{ github.sha }}-${{ github.run_number }}"

          # ⚠ junction 을 지울 때 Remove-Item -Recurse 를 쓰면 링크가 아니라
          #   "링크가 가리키는 실제 폴더의 내용"이 지워질 수 있습니다.
          #   rmdir 은 (/s 없이 쓰면) 링크만 제거하므로 안전합니다.
          if (Test-Path $cur) { cmd /c rmdir "$cur" }

          New-Item -ItemType Junction -Path $cur -Target $rel | Out-Null
          Write-Host "current --> $rel"

      - name: PM2 무중단 재시작
        run: |
          # 처음이면 start, 이미 떠 있으면 reload(워커를 하나씩 교체 → 무중단).
          # 새로 뜨는 워커가 방금 갈아끼운 current 를 읽습니다.
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
          pm2 list

      - name: 오래된 릴리스 정리
        run: |
          $dir = Join-Path $env:DEPLOY_ROOT "releases"
          Get-ChildItem $dir -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip ([int]$env:KEEP_RELEASES) |
            ForEach-Object {
              # 아직 워커가 붙잡고 있는 폴더는 지워지지 않습니다. 다음 배포 때 정리됩니다.
              try {
                Remove-Item $_.FullName -Recurse -Force -ErrorAction Stop
                Write-Host "삭제: $($_.Name)"
              } catch {
                Write-Host "건너뜀(사용 중): $($_.Name)"
              }
            }

      - name: Compose 서비스 기동 / 변경 서비스 재시작·재생성
        run: |
          # Snapshot before up: a stopped runtime must stay stopped on deployment.
          $activityWorker = @(docker ps --filter 'name=^/daengs-activity-worker$' --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0) { throw 'failed to inspect activity worker' }
          $activityBeat = @(docker ps --filter 'name=^/daengs-activity-beat$' --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0) { throw 'failed to inspect activity beat' }
          if (($activityWorker.Count -gt 0) -ne ($activityBeat.Count -gt 0)) {
            throw 'Activity runtime is incomplete; explicitly start or stop both services first'
          }
          $activityActive = $activityWorker.Count -gt 0
          if ($activityActive) {
            docker compose --profile activity-game stop activity-beat activity-worker
            if ($LASTEXITCODE -ne 0) { throw 'failed to pause activity runtime' }
          }

          # 새 서비스는 올리되, 이미 떠 있는 컨테이너를 매번 전부 끊지는 않습니다.
          docker compose up -d
          if ($LASTEXITCODE -ne 0) { throw 'failed to start compose services' }

          # Recreate both: imports and env_file values must match after deployment.
          docker compose up -d --no-deps --force-recreate --wait --wait-timeout 240 backend territory-vision-worker
          if ($LASTEXITCODE -ne 0) { throw 'failed to update backend and territory vision worker' }
          # Beat keeps its schedule in memory; reload the new recovery entry after code checkout.
          docker compose restart crawler-beat
          if ($LASTEXITCODE -ne 0) { throw 'failed to restart crawler beat' }
          if ($activityActive) {
            docker compose --profile activity-game up -d --no-deps --force-recreate --wait --wait-timeout 240 activity-worker
            if ($LASTEXITCODE -ne 0) { throw 'failed to update activity worker' }
            docker compose --profile activity-game up -d --no-deps --force-recreate --wait --wait-timeout 240 activity-beat
            if ($LASTEXITCODE -ne 0) { throw 'failed to update activity beat' }
          }

          # Only maintain the explicitly activated Walk runtime. Do not enable it on deploy.
          $walkWorker = @(docker ps --filter 'name=^/daengs-walk-context-worker$' --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0) { throw 'failed to inspect Walk worker' }
          $walkBeat = @(docker ps --filter 'name=^/daengs-walk-context-beat$' --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0) { throw 'failed to inspect Walk runtime' }
          if ($walkWorker.Count -gt 0 -and $walkBeat.Count -gt 0) {
            docker compose --profile walk-diary up -d --no-deps --force-recreate walk-context-worker walk-context-beat
            if ($LASTEXITCODE -ne 0) { throw 'failed to update Walk runtime' }
          }
          $walkCatalog = @(docker ps --filter 'name=^/daengs-walk-catalog-worker$' --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0) { throw 'failed to inspect Walk catalog worker' }
          if ($walkCatalog.Count -gt 0) {
            docker compose --profile walk-diary up -d --no-deps --force-recreate walk-catalog-worker
            if ($LASTEXITCODE -ne 0) { throw 'failed to update Walk catalog worker' }
          }

          $forceAll = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $changed = @()
          if (-not $forceAll) {
            $before = '${{ github.event.before }}'
            if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
              $forceAll = $true
            } else {
              $changed = @(git diff --name-only $before '${{ github.sha }}')
              if ($LASTEXITCODE -ne 0) { throw 'failed to compute deployment changed files' }
            }
          }

          $placeChanged = $forceAll -or @($changed | Where-Object {
            $_ -like 'backend/src/daengs_place/*' -or
            $_ -like 'backend/infra/place/*' -or
            $_ -in @('backend/pyproject.toml', 'backend/uv.lock', 'docker-compose.yml')
          }).Count -gt 0
          $nginxChanged = $forceAll -or @($changed | Where-Object {
            $_ -in @('nginx/default.conf', 'docker-compose.yml')
          }).Count -gt 0

          if ($placeChanged) {
            # place-search는 uvicorn --reload가 아니며 Alembic도 기동 때만 돕니다.
            docker compose up -d --no-deps --force-recreate place-search
          }
          if ($nginxChanged) {
            # 단일 파일 bind mount는 호스트 파일 교체 뒤 reload만 하면 옛 inode를 봅니다.
            docker compose up -d --no-deps --force-recreate nginx
          }

          docker compose ps
          docker compose exec -T nginx nginx -t

  post_deploy_smoke:
    name: 배포 후 공개 경로 확인
    needs: deploy
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Backend Walk 공개 경로 확인
        run: |
          # 인증이 필요한 API를 가짜 계정으로 호출하지 않고, 실행 중인 FastAPI가
          # 새 Walk 라우터를 실제로 등록했는지를 공개 OpenAPI에서 확인합니다.
          $requiredPath = '/app/walks/spatial-diary/views/query'
          foreach ($attempt in 1..18) {
            try {
              $openapi = Invoke-RestMethod `
                -Method Get `
                -Uri 'http://127.0.0.1:8000/openapi.json' `
                -TimeoutSec 10
              if ($requiredPath -notin $openapi.paths.PSObject.Properties.Name) {
                throw "Backend OpenAPI is missing $requiredPath"
              }
              Write-Host 'Backend Walk spatial diary route verified'
              break
            } catch {
              if ($attempt -eq 18) { throw }
              Start-Sleep -Seconds 5
            }
          }

      - name: Place 공개 경로 확인
        run: |
          # 배포에서는 공개 경로와 APP 응답 계약만 확인합니다.
          # 실제 cafe 데이터 존재 여부는 place-search-ingest.yml의 적재 후 검증이 담당합니다.
          $body = '{"lat":37.5665,"lng":126.9780,"kinds":["cafe"],"limit_per_kind":1}'
          foreach ($attempt in 1..18) {
            try {
              $response = Invoke-RestMethod `
                -Method Post `
                -Uri 'http://127.0.0.1:8000/v2/places/search' `
                -ContentType 'application/json' `
                -Body $body `
                -TimeoutSec 10
              $group = @($response.groups | Where-Object kind -eq 'cafe')
              if ($group.Count -ne 1) {
                throw 'Place response must contain exactly one cafe group'
              }
              $requiredFields = @('kind', 'sort', 'limit', 'truncated', 'results')
              $missingFields = @($requiredFields | Where-Object {
                $_ -notin $group[0].PSObject.Properties.Name
              })
              if ($missingFields.Count -ne 0 -or
                  $group[0].results -isnot [System.Array]) {
                throw 'Place response does not match APP contract'
              }
              Write-Host 'Place APP contract verified'
              break
            } catch {
              if ($attempt -eq 18) { throw }
              Start-Sleep -Seconds 5
            }
          }

      - name: Territory Site 공개 경로 확인
        run: |
          # 현행 140u 게임판이 없으면 배포를 성공으로 표시하지 않습니다. 코드/마이그레이션
          # 반영 뒤 territory-sites.md의 적재를 끝내고 이 workflow를 다시 실행해야 합니다.
          foreach ($attempt in 1..18) {
            try {
              $response = Invoke-RestMethod `
                -Method Get `
                -Uri 'http://127.0.0.1:8000/territory/sites/nearby?lat=37.5665&lng=126.9780&radius_m=3000&limit=1' `
                -TimeoutSec 10
              $requiredFields = @('count', 'truncated', 'sites')
              $missingFields = @($requiredFields | Where-Object {
                $_ -notin $response.PSObject.Properties.Name
              })
              if ($missingFields.Count -ne 0 -or
                  $response.sites -isnot [System.Array]) {
                throw 'Territory Site response does not match APP contract'
              }
              break
            } catch {
              if ($attempt -eq 18) { throw }
              Start-Sleep -Seconds 5
            }
          }
          if (@($response.sites).Count -lt 1 -or $response.count -lt 1) {
            throw 'Active 140u territory gameboard is empty; run the documented ingest first'
          }
          Write-Host "Territory Site data-ready verified: $($response.sites[0].site_id)"

      - name: Journey 공개 경로 확인
        run: |
          # 현재 APP이 보내는 dog_id 없는 좌표 요청입니다. 외부 키가 없어도 원본 계약대로
          # 명시적인 estimate 응답과 지도 앱 handoff를 반환해야 합니다.
          $body = '{"origin":[37.5665,126.9780],"dests":[{"lat":37.5700,"lng":126.9820,"name":"destination"}],"companion":"dog","measured":true,"with_polyline":false}'
          foreach ($attempt in 1..18) {
            try {
              $response = Invoke-RestMethod `
                -Method Post `
                -Uri 'http://127.0.0.1:8000/journey' `
                -ContentType 'application/json' `
                -Body $body `
                -TimeoutSec 30
              $item = @($response.items)[0]
              $walk = $item.transport.walk
              if ($response.companion -eq 'dog' -and
                  $null -ne $walk -and
                  $walk.status -in @('measured', 'estimate') -and
                  $walk.handoff.naver -like 'nmap://route/walk*') {
                Write-Host 'Journey APP contract verified'
                break
              }
              throw 'Journey response does not match APP contract'
            } catch {
              if ($attempt -eq 18) { throw }
              Start-Sleep -Seconds 5
            }
          }
