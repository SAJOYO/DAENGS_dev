# 산책 적합도 임계 (RT-001 ③-d)
#
# **값마다 출처를 붙인다.** 이 레포 파트①의 KPI 가 "출처 링크 + 조항 번호 인용"인데, 파트②에서
# 근거 없는 숫자를 조용히 박으면 같은 기준을 스스로 어긴다. 출처가 없으면 `우리 선택` 이라고
# 명시한다 — 숨기지 않는 것이 규칙이고, 그래야 나중에 근거가 생겼을 때 무엇을 고칠지 안다.
#
# 코드가 아니라 설정에 두는 이유 — 임계는 언제든 조정되는 값이고(재논의 비용 🟢), 기관 기준이
# 바뀌어도 `rules.py` 를 안 건드리게 하려는 것이다.
#
# **비인용 숫자는 넷뿐이다** — 전부 `우리 선택` 으로 표시돼 있다:
#   `feels_like.summer_from_c` 25 · `heat.caution_from_c` 31 · `heat.cold_caution_from_c` 0 ·
#   `heat.cold_caution_below_c` 5
# 그 밖에 우리 판단이 낀 곳이 둘 더 있고 각각 그 자리에 적어 뒀다 —
# 한파 기준(기온)을 체감온도에 적용하는 **매핑**, 그리고 폭염주의보 기준을 한 칸 **당겨 쓰는 판단**.

feels_like:
  # ③-c — 적용 경계는 계절이 아니라 **기온**으로 가른다. 월로 가르면 10월 이상고온이나
  # 4월 한파에서 엉뚱한 산식을 쓴다.
  summer_from_c: 25.0     # 우리 선택 — 기상청은 5~9월 계절 운영이라 명시 하한이 없다.
                          # 회귀식이 고온에서 적합됐고 그 아래는 폭염 판정과 무관하다는 판단.
  winter_to_c: 10.0       # 기상청/JAG·TI 2001 풍속냉각지수 **공식 적용 조건**
  winter_wind_min_ms: 1.3 # 〃 (공식 조건 그대로)

heat:
  # 더운 쪽 — 체감온도 기준
  caution_from_c: 31.0    # 우리 선택 — `UNSAFE` 한 칸 아래에 주의 구간을 둔다
  unsafe_from_c: 33.0     # 기상청 **폭염주의보** 기준(체감 33℃)을 한 칸 당겨 씀.
                          # 사람 기준이면 33~35 가 주의보역이지만, 개는 땀샘이 거의 없어
                          # 헐떡임으로만 체온을 낮추고 그 효율이 습도에 급격히 무너진다.
                          # 숫자는 인용값이고 새로 만든 것은 "당겨 쓴다"는 판단뿐이다.
  # 추운 쪽
  cold_caution_below_c: 5.0   # 우리 선택 — 0~5℃ 구간을 주의로
  cold_caution_from_c: 0.0    # 우리 선택
  cold_unsafe_below_c: -12.0  # 기상청 **한파주의보** 기준.
                              # ⚠️ 원 기준은 **기온**인데 우리는 **체감온도**에 적용한다.
                              # 우리 매핑이고, 체감온도가 기온보다 낮으므로 안전 방향이다.

air:
  # 환경부 대기환경기준 4단계를 3단계로 압축한다 (③-d 원칙 3).
  #   좋음·보통 -> GOOD  /  나쁨 -> CAUTION  /  매우나쁨 -> UNSAFE
  # **강아지 조정을 넣지 않는다.** 개가 지면 가까이 호흡한다는 것은 정성적으로 맞지만
  # 측정소 값과의 차이를 정량화할 근거가 없다 (③-d).
  pm10:                   # 환경부 — 30 / 80 / 150 ㎍/㎥
    caution_from: 81
    unsafe_from: 151
  pm25:                   # 환경부 — 15 / 35 / 75 ㎍/㎥
    caution_from: 36
    unsafe_from: 76
  # 미래 시각은 값이 없다. 권역 일 등급(`informGrade`)의 **기관 라벨**을 그대로 매핑한다 —
  # persistence(현재값 지속)는 ③-b ②에서 기각됐다. 근거 없는 외삽이기 때문이다.
  forecast_labels:
    좋음: GOOD
    보통: GOOD
    나쁨: CAUTION
    매우나쁨: UNSAFE

rain:
  # 비인용 숫자 0개. **강수량 자체로는 `UNSAFE` 를 만들지 않는다** — "몇 mm 부터 위험한가"를
  # 우리가 정하는 대신 **호우특보가 곧 기관의 위험 판정**이므로 그것을 쓴다 (③-d).
  precip_prob_note: 강수확률은 판정에 안 쓴다 — 확률은 사건이 아니다

# 특보 -> 축 (③-d). 해상용(풍랑·폭풍해일·지진해일)과 건조는 축이 없어 무시한다.
warnings:
  # **발효 중인 특보를 미래에 얼마나 끌고 가는가.** ③-a 의 커버리지 표가 정한 값이다 —
  # 특보는 "현재 발효만" 이고 ~T+6h 까지 "현재 발효 유지"(실용적), T+24h 는 ❌(개략).
  #
  # 없으면 안 되는 이유: `valid_to` 가 `None`(해제 시각 미정)이라 그대로 두면 발효 중인
  # 폭염경보가 **T+24h 전체를 `UNSAFE` 로 만든다.** 새벽 3시 체감 28.0℃ 도 `UNSAFE` 가 되어
  # 타임라인이 통째로 쓸모없어지고, 이는 ③-b ②가 미래 대기질 persistence 를 기각한 것과
  # **같은 종류의 근거 없는 외삽**이다.
  #
  # 그 너머에서는 축이 값으로 판정된다 — ⑤-a 근거 1 이 "특보는 보강이지 필수가 아니다"라고
  # 한 그대로이고, 실측에서도 체감 33.27℃ ≥ 33 이라 특보 없이 같은 답이 나왔다.
  carry_forward_hours: 6
  axes:
    heat: HEAT
    cold: HEAT
    yellow_dust: AIR
    heavy_rain: RAIN
    heavy_snow: RAIN
    wind: RAIN
    typhoon: RAIN
