[project]
name = "dog-ai-assistant"
version = "0.1.0"
description = "반려견 생활 관리 AI 비서 — MVP (core-rag-mvp)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "ollama>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api>=1.2",
    "yt-dlp>=2026.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
