<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>반려견 AI 비서 - 테스트 UI</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --bubble-user: #2563eb;
    --bubble-user-fg: #ffffff;
    --bubble-bot: #f1f2f4;
    --bubble-bot-fg: #1a1a1a;
    --grounded: #16a34a;
    --ungrounded: #d97706;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #202127;
      --text: #f2f2f3;
      --muted: #9ca3af;
      --border: #33343a;
      --bubble-bot: #2b2c33;
      --bubble-bot-fg: #f2f2f3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--bubble-bot-fg);
    border-bottom-left-radius: 4px;
  }
  .bubble.error {
    background: color-mix(in srgb, var(--error) 15%, var(--bubble-bot));
    border: 1px solid var(--error);
  }
  .meta {
    margin-top: 8px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge.grounded { background: color-mix(in srgb, var(--grounded) 18%, transparent); color: var(--grounded); }
  .badge.ungrounded { background: color-mix(in srgb, var(--ungrounded) 18%, transparent); color: var(--ungrounded); }
  details.sources {
    margin-top: 6px;
    font-size: 12px;
  }
  details.sources summary {
    cursor: pointer;
    color: var(--muted);
  }
  .source-item {
    padding: 6px 0;
    border-top: 1px solid var(--border);
    color: var(--muted);
  }
  .source-item .score { color: var(--accent); font-weight: 600; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 120px;
  }
  textarea:focus { outline: 2px solid var(--accent); }
  button {
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing {
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🐶 반려견 AI 비서 — 테스트 UI</h1>
    <p>로컬 RAG 서버(<code>/chat</code>)에 직접 질의합니다. 개발/QA 용도의 최소 UI입니다.</p>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <textarea id="query" rows="1" placeholder="예: 포도 먹여도 돼?" autofocus></textarea>
    <button type="submit" id="send-btn">전송</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('query');
  const sendBtn = document.getElementById('send-btn');

  function addRow(role, contentEl) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    row.appendChild(contentEl);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function userBubble(text) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    return bubble;
  }

  function botBubble(data) {
    const wrap = document.createElement('div');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = data.answer;
    wrap.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const badge = document.createElement('span');
    badge.className = 'badge ' + (data.grounded ? 'grounded' : 'ungrounded');
    badge.textContent = data.grounded ? 'grounded' : 'ungrounded';
    meta.appendChild(badge);
    wrap.appendChild(meta);

    if (data.sources && data.sources.length > 0) {
      const details = document.createElement('details');
      details.className = 'sources';
      const summary = document.createElement('summary');
      summary.textContent = `참고 문서 ${data.sources.length}건`;
      details.appendChild(summary);
      data.sources.forEach(s => {
        const item = document.createElement('div');
        item.className = 'source-item';
        const score = document.createElement('span');
        score.className = 'score';
        score.textContent = `[${s.score.toFixed(3)}] `;
        item.appendChild(score);
        item.appendChild(document.createTextNode(s.content));
        details.appendChild(item);
      });
      wrap.appendChild(details);
    }
    return wrap;
  }

  function errorBubble(text) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble error';
    bubble.textContent = text;
    return bubble;
  }

  function typingIndicator() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.textContent = '답변 생성 중…';
    return el;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    addRow('user', userBubble(query));
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const typingRow = addRow('bot', typingIndicator());

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      typingRow.remove();

      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try {
          const errJson = await res.json();
          detail = errJson.detail || detail;
        } catch (_) {}
        addRow('bot', errorBubble(detail));
        return;
      }

      const data = await res.json();
      addRow('bot', botBubble(data));
    } catch (err) {
      typingRow.remove();
      addRow('bot', errorBubble('서버에 연결할 수 없습니다: ' + err.message));
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
