# GCP 전용 오버레이 (D-042). 로컬 서버·개발 PC 는 이 파일을 쓰지 않습니다.
#
# 기동 (docs/deploy-gcp.md 의 절차 안에서):
#   docker compose -f docker-compose.yml -f docker-compose.gcp.yml --profile gait \
#     up -d nginx backend place-search journey-service gait-analysis
#
# 크롤러(crawler-worker · crawler-beat)는 **일부러 목록에 없습니다** — 코퍼스 정본은
# 로컬 서버입니다. 단 compose 는 파일 해석 시점에 `:?` 가드를 평가하므로, 안 띄워도
# 최상단 .env 의 DAENGS_CORPUS_DIR 에는 더미 경로가 있어야 합니다 (deploy-gcp.md).
services:
  nginx:
    ports:
      # 80·8000 은 base 에 이미 있습니다(ports 는 병합-추가). 8000 을 굳이 빼지 않는
      # 이유: 호스트의 Next(서버사이드 프록시, NEXT_PUBLIC_API_ORIGIN 기본값
      # 127.0.0.1:8000)가 씁니다. 바깥은 GCP 방화벽이 80/443 외 전부 막습니다.
      - "443:443"
    # volumes 는 병합하면 base 의 default.conf 와 겹치므로 통째로 바꿉니다.
    # gcp.conf 가 default.conf 자리를 대신합니다 — 80(ACME/리다이렉트) · 443 ×2 ·
    # 8000(호스트 내부용) 블록을 모두 담은 자립 파일입니다.
    volumes: !override
      - ./nginx/gcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/api-locations.inc:/etc/nginx/conf.d/api-locations.inc:ro
      # 인증서. named volume 이 아니라 호스트 경로인 이유: 발급·갱신을 compose 밖의
      # 일회성 certbot 컨테이너(docker run)로 하므로, 프로젝트 접두사가 붙는 named
      # volume 이름을 맞추는 것보다 경로 공유가 단순합니다.
      - /srv/daengs/letsencrypt:/etc/letsencrypt:ro

  gait-analysis:
    # 영상 분석이 CPU 를 분 단위로 잡습니다. 4vCPU 중 2.5 로 묶어 분석이 도는 동안에도
    # 나머지 API 에 1.5 vCPU 를 남깁니다 (노션 클라우드 이전 검토 · D-042).
    cpus: 2.5
