# WebSocket 업그레이드용 매핑.
# Upgrade 헤더가 있으면 "upgrade", 없으면 "close" 를 Connection 에 넣습니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# APP은 한 검색이 끝난 뒤 다음 검색을 보낸다. 공개된 PostGIS 검색을 한 IP가 연속으로
# 두드려 기존 API까지 굶기지 못하게 정상 UI보다 넉넉한 초당 5회, 순간 10회를 둔다 (D-028).
limit_req_zone $binary_remote_addr zone=place_search_per_ip:10m rate=5r/s;

# ---------------------------------------------------------------------
# Docker 내장 DNS. 주소 127.0.0.11 은 compose 네트워크 안에서 고정입니다.
#
# **이게 없으면 backend 재생성 때마다 502 가 납니다** (#31). nginx 는 upstream
# 블록에 적힌 이름을 **기동할 때 딱 한 번** 풀고 그 IP 를 프로세스가 죽을 때까지
# 씁니다. daengs-backend 는 compose 가 재생성할 때마다 IP 가 바뀌는데
# (environment 를 고치면 재생성됩니다) nginx 는 그것을 모릅니다.
#
# resolver + proxy_pass 의 변수를 같이 써야 매 요청마다 다시 풉니다.
# 변수가 없으면 resolver 를 적어 둬도 아무 일도 일어나지 않습니다 — 둘은 세트입니다.
#
# valid=10s 는 nginx 가 이 결과를 캐시하는 시간입니다. 재생성 후 최대 10초는
# 옛 IP 로 갈 수 있다는 뜻이고, 그 뒤로는 알아서 복구됩니다.
# ipv6=off 는 Docker DNS 가 AAAA 에 빈 응답을 주면서 남기는 잡음을 없앱니다.
# ---------------------------------------------------------------------
resolver 127.0.0.11 ipv6=off valid=10s;

# 호스트(이 PC)에서 PM2 로 돌고 있는 Next 서버.
#
# 여기는 upstream 블록 그대로 둡니다. host.docker.internal 은 게이트웨이 IP 라
# 컨테이너가 재생성돼도 안 바뀌어서, 위 문제를 겪지 않습니다.
# (같은 파일에서 backend 만 502 였던 것이 진단의 근거였습니다 — #31)
upstream nextjs {
    server host.docker.internal:3000;
}

# backend 는 upstream 블록을 두지 않습니다.
# 이름이 upstream 으로 정의돼 있으면 proxy_pass 의 변수가 DNS 보다 그 블록을
# 먼저 집어서, 변수를 써도 옛 IP 를 그대로 씁니다. 아래 두 곳에서 set 으로 씁니다.

server {
    listen      80;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 통과 (개발 중 HMR, 향후 실시간 기능)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # 관계 일기 기본 상한: 64회 × 15s + 63간격 × 10s + 처리 15s + 수집 12s + 저장 15s.
    location ~ ^/api/app/walks/[0-9a-fA-F-]+/storyboard$ {
        set $fastapi_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1650s;
    }

    # 도감 카드 AI 생성 (#496) — 한 장 20~60초, 유사도 미달이면 한 번 더. 60s 면 504 가 난 뒤에도
    # backend 는 계속 돌아 돈만 나간다. 아래 /api/ 블록과 같은 upstream·헤더, 시간만 길다.
    location /api/admin/cardimage/ {
        set $fastapi_upstream backend:8000;

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        # 폰 원본 사진이 10MB 를 넘는다 — backend `photo.MAX_PHOTO_BYTES`(20 MiB)와 같은 값.
        client_max_body_size  20m;
    }

    # 프론트와 API 를 같은 오리진으로 묶습니다.
    # /api/auth/login 요청이 백엔드의 /auth/login 으로 전달됩니다.
    #
    # **이 블록이 로그인의 전제입니다** (D-015). daengs.~ 와 daengback.~ 는 브라우저에게
    # 다른 오리진이라 httpOnly 쿠키가 그냥은 실리지 않습니다. **포트가 아니라 호스트명이
    # 달라서입니다** — 바깥에서는 둘 다 :80 입니다 (2026-09-04 실측. 전에 이 주석이
    # :8000 이라고 적어 두어 "포트를 맞추면 된다"로 읽혔습니다).
    # 오리진을 유지한 채 쿠키를 보내려면 SameSite=None + Secure 라 HTTPS 가 필수인데
    # 지금은 http 입니다. 여기로 묶어서 같은 오리진을 만드는 것이 답입니다.
    #
    # daengback.~ 는 그대로 둡니다. 앱·외부 클라이언트가 쓰는 길이고,
    # 그쪽은 쿠키가 아니라 Authorization: Bearer 를 씁니다.
    location /api/ {
        # **set 이 rewrite 보다 먼저 와야 합니다.** 둘 다 rewrite 모듈이고,
        # break 는 그 단계를 거기서 끊습니다 — 뒤에 두면 set 이 아예 실행되지 않아
        # 변수가 빈 채로 남고, nginx 가 500 과 함께
        # `invalid URL prefix in "http://"` 를 로그에 남깁니다. (#31 에서 실제로 겪음)
        set $fastapi_upstream backend:8000;

        # /api 접두사는 이 rewrite 가 뗍니다.
        #
        # 전에는 proxy_pass 끝의 슬래시(http://fastapi/)가 그 일을 했습니다.
        # **proxy_pass 에 변수를 쓰면 그 규칙이 없어집니다** — 끝 슬래시를 붙여도
        # 접두사가 안 떨어져서 백엔드가 /api/auth/login 을 받고 404 를 냅니다.
        # 그래서 접두사 제거를 여기로 옮겼습니다. 둘 중 하나만 있어야 하고,
        # 여기를 틀리면 관리자 로그인이 통째로 깨집니다 (#29 · #31 · D-015).
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 로그인 실패 횟수를 이 값으로 셉니다 (services/login_attempts.py).
        # $remote_addr 로 **덮어쓰는** 것이 중요합니다 — 클라이언트가 같은 이름의
        # 헤더를 보내도 여기서 지워지므로 위조할 수 없습니다.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 중에는 uvicorn 이 리로드로 잠깐 내려갈 수 있습니다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------
# daengback.~  (API)
#
# **이 블록이 8000 을 듣는 것과, 바깥에서 8000 으로 들어오는 것은 다른 이야기입니다.**
# 공개 경로는 daengback.~:80 이고, 공인 IP 의 8000 은 아예 안 열립니다 — 8000 으로
# 직접 닿는 것은 LAN 뿐입니다 (192.168.0.22:8000, 2026-09-04 실측).
#
# **호스트명 분기는 여기서 하는 게 아닙니다.** 위 블록도 이 블록도 server_name 이 `_`
# (catch-all)이라, LAN 의 80 은 Host 를 daengback.~ 로 줘도 위 블록(Next)이 받습니다.
# 공개에서 daengs.~ 와 daengback.~ 가 갈리는 것은 **이 파일 밖의 무언가**가 하는 일이고,
# 그 설정은 저장소에 없습니다. 여기 server_name 을 고쳐서 갈라 보려 하기 전에
# 서버의 앞단부터 확인하세요.
#
# backend 컨테이너는 포트를 열지 않습니다. 여기를 통해서만 들어옵니다.
# 같은 compose 네트워크라 서비스 이름으로 바로 붙습니다.
# ---------------------------------------------------------------------
server {
    listen      8000;
    server_name _;

    client_max_body_size 20m;

    # 피부 병변 스크리닝 (D-024). 앱이 부르는 주소는
    #   http://daengback.~/screen/v1/screen
    #
    # **별도 포트를 안 씁니다.** 밖에서 열려 있는 건 80 뿐이고 daengback 이 그걸
    # 서버 PC 의 8000 으로 넘겨 주므로, 여기에 경로 하나만 얹으면 공유기 포트포워딩도
    # 방화벽도 DNS 도 건드릴 게 없습니다. HTTPS 를 붙일 때도 backend 와 한 번에 됩니다.
    #
    # ⚠️ 스크리닝 컨테이너는 profile 뒤에 있어 기본으로는 안 뜹니다. 꺼져 있으면
    #    이 경로만 502 이고 나머지는 멀쩡합니다 (docker compose --profile screening up -d).
    location /screen/ {
        # 변수를 쓰는 이유는 backend 블록과 같습니다 (D-020) — 컨테이너를
        # 재생성하면 IP 가 바뀌는데 upstream 블록에 적으면 옛 IP 를 계속 씁니다.
        set $screening_upstream backend:8000;

        # ⚠️ **접두사를 떼지 않습니다** (D-039). 스크리닝이 backend 안으로 들어오면서
        #    라우터가 prefix="/screen" 을 갖게 됐습니다. 여기서 떼면 /v1/screen 이
        #    backend 에 없어서 404 입니다. 앱이 부르는 주소는 그대로입니다.
        proxy_pass http://$screening_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 사진 한 장에 CPU 로 0.6~3초입니다 (실측 641ms).
        proxy_connect_timeout   5s;
        proxy_read_timeout    120s;
    }

    # 강아지 보행 영상 분석 — **옛 무인증 경로. 이제 막습니다** (#64 · D-043).
    #
    # 여기는 인증이 없었습니다. `dog_id` 를 넘어온 대로 믿어서 **남의 id 를 넣으면 남의
    # 영상 목록을 받아오고 지울 수 있었습니다.** 보행 영상에는 사람과 집 앞이 찍힙니다.
    #
    # 앱은 backend 가 소유하는 `/app/gait/…` 로 옮겼습니다 — 토큰으로 사람을 확인하고
    # `pet_id → pets.app_user_id` 로 소유권을 봅니다. 실기기 왕복까지 검증했습니다
    # (2026-09-02: 분석 2회 연속 DONE).
    #
    # 처음(#145)에는 경로만 닫고 `gait-analysis` 컨테이너는 남겨 뒀는데, D-063 4단계에서
    # 서비스·코드까지 지웠습니다. 이 블록은 **옛 앱 빌드를 위한 묘비**로 계속 남깁니다.
    # 옛 기록(gait-data 볼륨의 JSON)은 볼륨 선언만 남겨 보존 중이고 처분은 별도 결정입니다.
    #
    # ⚠️ **410 이지 404 가 아닙니다.** 없는 척하면 옛 앱이 "서버가 잠깐 이상한가" 하고
    #    계속 재시도합니다. 410 Gone 은 "여기 있었지만 이제 없다"라서, 로그만 봐도
    #    옛 빌드가 아직 남아 있다는 것이 드러납니다.
    location /gait/ {
        default_type application/json;
        return 410 '{"detail":"이 주소는 더 이상 쓰지 않습니다. 앱을 최신 버전으로 업데이트해 주세요."}';
    }

    # Place 검색 (D-027). APP 이 이미 보내는 경로와 place-search 가 받는 경로가
    # 둘 다 `/v2/places/search` 이므로 접두사 제거도 요청 변환도 하지 않습니다.
    # backend 와 반려견 프로필은 이 요청 경로에 들어오지 않습니다.
    location /v2/places/ {
        limit_req zone=place_search_per_ip burst=10 nodelay;
        limit_req_status 429;

        set $place_search_upstream place-search:8000;
        proxy_pass http://$place_search_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 점령 게임판 읽기. 시설 검색과 같은 PostGIS 런타임을 쓰지만 HTTP 표면은 분리합니다.
    # 접두사를 떼지 않으며, 앱에는 원천 시설 정보가 아니라 중립 점령지 좌표만 반환합니다.
    location /territory/sites/ {
        limit_req zone=place_search_per_ip burst=10 nodelay;
        limit_req_status 429;

        set $place_search_upstream place-search:8000;
        proxy_pass http://$place_search_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 장소 선택 뒤 APP이 호출하는 기존 공용 이동 경로. URI와 본문을 바꾸지 않고
    # 별도 Journey 서비스로 전달합니다. Place 검색의 rate limit을 여기로 넓히지 않습니다.
    location = /journey {
        set $journey_upstream journey-service:8000;
        proxy_pass http://$journey_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 보행 분석 **새 흐름** `/app/gait/*` (D-043). backend 가 소유하는 인증·소유권·
    # record/job 계약이라 **접두사를 떼지 않고** backend 로 넘깁니다 (location / 과 같은
    # 목적지). 위 `/gait/`(옛 무인증 직접 HTTP)와는 다른 경로·다른 서비스입니다.
    #
    # 별도 블록을 두는 **유일한 이유는 업로드 크기**입니다. 임시 LocalBridge 검증에서 앱이
    # 영상을 `PUT /app/gait/_bridge/upload/...` 로 올리는데, 이 server 블록 기본값 20m 로는
    # 산책 영상이 413 이 됩니다(/gait/ 과 같은 사정, 표본 5~120MB). analyze·confirm·records
    # 는 작은 JSON 이라 상한이 넉넉해도 아무 영향이 없습니다.
    #
    # ⚠️ GCS(원칙 1)로 가면 앱이 GCS 에 직접 올려 이 경로로 큰 본문이 오지 않습니다 — 그때
    #    이 블록은 사실상 필요 없어지지만, 남은 큰 상한은 무해합니다(작은 JSON 뿐).
    # APP 직접 API 경로도 동일한 관계 일기 실행 시간을 보장한다.
    location ~ ^/app/walks/[0-9a-fA-F-]+/storyboard$ {
        set $fastapi_upstream backend:8000;
        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1650s;
    }

    location /app/gait/ {
        set $fastapi_upstream backend:8000;
        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /gait/ 과 같은 이유 — 영상 업로드라 20m 로는 413.
        client_max_body_size 200m;

        # bridge 업로드가 느릴 수 있어 넉넉히. analyze/confirm/records 응답은 즉시라 이 값에
        # 안 걸립니다 — 분석은 gait-worker 가 비동기로 하고 앱은 GET 으로 폴링합니다.
        proxy_connect_timeout   5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        # 여기는 접두사를 떼지 않으므로 rewrite 가 필요 없습니다.
        # 변수를 쓰면 요청 URI 가 온 그대로 전달됩니다.
        set $fastapi_upstream backend:8000;
        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 중에는 uvicorn 이 리로드로 잠깐 내려갈 수 있습니다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
