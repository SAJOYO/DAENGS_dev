# place-search 의 테스트를 실제 PostGIS 위에서 돌립니다 (D-026).
#
# GitHub-hosted 러너를 씁니다 — self-hosted 러너(deploy.yml)는 배포 전용이고,
# 서버 PC 에서 테스트용 PostGIS 컨테이너를 띄웠다 지우게 하고 싶지 않습니다.
# 단위 테스트만 돌리면 SQL 이 실제 PostGIS 에서 도는지 아무도 모릅니다 —
# 이관해 온 테스트의 절반이 integration 인 이유가 그것입니다.
name: place-search tests

on:
  pull_request:
    paths:
      - "backend/src/daengs_place/**"
      - "backend/tests/place/**"
      - "backend/infra/place/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "docker-compose.yml"
      - "nginx/default.conf"
      - "nginx/api-locations.inc"
      - "nginx/api-locations.test.conf"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/place-search-ingest.yml"
      - ".github/workflows/territory-sites-ingest.yml"
      - ".github/workflows/place-search-tests.yml"
  push:
    branches: [dev]
    paths:
      - "backend/src/daengs_place/**"
      - "backend/tests/place/**"
      - "backend/infra/place/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "docker-compose.yml"
      - "nginx/default.conf"
      - "nginx/api-locations.inc"
      - "nginx/api-locations.test.conf"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/place-search-ingest.yml"
      - ".github/workflows/territory-sites-ingest.yml"
      - ".github/workflows/place-search-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      place-db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: place
          POSTGRES_PASSWORD: place
          POSTGRES_DB: place
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U place -d place"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DAENGS_DATABASE_URL: postgresql+asyncpg://place:place@localhost:5432/place
    steps:
      - uses: actions/checkout@v4
      - name: Compose 설정
        working-directory: ${{ github.workspace }}
        env:
          DAENGS_TRAINING_RAG_BASE_URL: http://host.docker.internal:8010
          REDIS_PASSWORD: ci-only-password
          # 서버 폴더 가드(`:?`, RAG-050). CI 는 크롤러를 띄우지 않으니 렌더만 통과하면 된다.
          DAENGS_CORPUS_DIR: ./data
        run: docker compose config --quiet
      - name: nginx 설정
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          local_config="$(
            docker run --rm \
              --add-host host.docker.internal:host-gateway \
              -v "${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.31.1 nginx -T 2>&1
          )"
          printf '%s\n' "$local_config"

          cloud_include_config="$(
            docker run --rm \
              -v "${{ github.workspace }}/nginx/api-locations.test.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "${{ github.workspace }}/nginx/api-locations.inc:/etc/nginx/conf.d/api-locations.inc:ro" \
              nginx:1.31.1 nginx -T 2>&1
          )"
          printf '%s\n' "$cloud_include_config"

          grep -Fq \
            'limit_req_zone $binary_remote_addr zone=place_search_per_ip:10m rate=5r/s;' \
            <<< "$local_config"

          place_location="$(
            awk '
              $1 == "location" && $2 == "/v2/places/" && $3 == "{" { inside = 1 }
              inside { print }
              inside && $1 == "}" { exit }
            ' <<< "$local_config"
          )"
          grep -Fq 'limit_req zone=place_search_per_ip burst=10 nodelay;' \
            <<< "$place_location"
          grep -Fq 'limit_req_status 429;' <<< "$place_location"

          territory_location="$(
            awk '
              $1 == "location" && $2 == "/territory/sites/" && $3 == "{" { inside = 1 }
              inside { print }
              inside && $1 == "}" { exit }
            ' <<< "$local_config"
          )"
          grep -Fq 'limit_req zone=place_search_per_ip burst=10 nodelay;' \
            <<< "$territory_location"
          grep -Fq 'set $place_search_upstream place-search:8000;' \
            <<< "$territory_location"

          # local API server와 GCP include가 같은 공개 location 집합을 갖는지 확인합니다.
          # default.conf의 프론트 전용 /api/만 비교에서 제외합니다.
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^\s*location\s+(.+?)\s*\{", re.MULTILINE)
          local = set(pattern.findall(Path("nginx/default.conf").read_text(encoding="utf-8")))
          cloud = set(pattern.findall(Path("nginx/api-locations.inc").read_text(encoding="utf-8")))
          local.discard("/api/")
          if local != cloud:
              raise SystemExit(
                  f"nginx location mismatch: local-only={sorted(local - cloud)}, "
                  f"cloud-only={sorted(cloud - local)}"
              )
          PY
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: 의존성
        run: uv sync --frozen --extra place
      - name: 스키마 (Alembic 전체 이력이 실제로 적용되는지도 여기서 검증됩니다)
        run: uv run alembic -c infra/place/alembic.ini upgrade head
      - name: 테스트
        run: uv run pytest -q tests/place
      - name: 린트
        run: uv run ruff check src/daengs_place tests/place
