# ⚠ **이 워크플로는 돌지 않습니다.** 세 job 모두 `ubuntu-latest`/`windows-latest` 인데,
# 이 팀은 GitHub 호스티드 러너를 쓰지 않기로 했습니다(비용 — 영구 결정). `self-hosted` 인
# `db-migrate.yml` 만 실제로 돕니다. `coverage` 서브커맨드(위 `names` job)가 실제로 지금
# 도는 자리는 **`backend/tests/test_migration_verification_harness.py`** 입니다 — 그 pytest
# 파일이 "모든 `db/migrations/*.sql` 은 짝 `verify_*.sql` 을 갖고, 그 verify 는
# `RAISE EXCEPTION` 을 갖고, `CHECKS` 에 등록됐는지"를 매 `uv run pytest` 마다 확인합니다.
# `sql`·`windows` 서브커맨드는 그쪽으로 옮기지 않았습니다 — `sql` 은 이 개발 환경 PATH 에
# 없는 `psql` CLI 를 요구하고, `windows` 는 이 브랜치가 실제로 낸 부채(커버리지 누락)와
# 무관한 영역(워크플로 스크립트 리터럴)을 잽니다. 아래 job 정의는 지우지 않습니다 — 나중에
# self-hosted 러너로 옮기면 그대로 쓸 자리입니다.
name: migration verification
on:
  pull_request:
    paths:
      - 'db/**'
      - '.github/workflows/db-migrate.yml'
      - '.github/workflows/migration-verification-tests.yml'
      - 'tools/check_migration_verification.py'
      - 'tools/check_migration_names.py'
  push:
    branches: [dev]
    paths:
      - 'db/**'
      - '.github/workflows/db-migrate.yml'
      - '.github/workflows/migration-verification-tests.yml'
      - 'tools/check_migration_verification.py'
      - 'tools/check_migration_names.py'
permissions:
  contents: read
jobs:
  # 이름·짝과 **검증 커버리지**를 봅니다. DB 를 안 쓰므로 아래 두 job 보다 먼저 끝납니다.
  #
  # **2026-09-07(#295)부터 폴더 전체를 봅니다.** 그 전에는 이 PR 이 건드린 파일만 봤는데,
  # 이유가 *"폴더 전체에 걸면 verify 짝이 없는 옛 파일 여덟이 첫날부터 빨간불"* 이었고
  # **#292 가 그 여덟을 다 채워 전제가 사라졌습니다.** 그래서 `fetch-depth: 0` 도,
  # 바뀐 파일을 고르는 단계도 필요 없어졌습니다.
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 이름과 짝 (내용은 안 봅니다)
      - run: python tools/check_migration_names.py
      # 짝이 **단언형이고 하네스에 등록됐는지**. 같은 부채가 두 번 났기 때문에 있습니다 —
      # #273 이 "SELECT 나열이라 틀려도 녹색"인 여섯 장을 고쳤는데 여덟 장이 그때 목록에
      # 안 들어갔고, #292 가 그것을 다시 발견했습니다. 목록을 사람이 관리하면 세 번째가 옵니다.
      - run: python tools/check_migration_verification.py coverage
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # ⚠️ **`postgres:17` 이 아니다.** `2026-09-01_training_rag_into_vectordb.sql` 이
        #    `vector(768)` 컬럼과 `hnsw` 인덱스를 만들어서, 확장 없는 Postgres 에서는
        #    마이그레이션 자체가 안 돈다 — 그 verify 를 하네스에 등록할 수 없었다.
        #    같은 PG 17 에 pgvector 만 얹은 이미지이고, 다른 항목은 영향받지 않는다.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-password
      PGDATABASE: migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_migration_verification.py sql
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_migration_verification.py windows
