name: Walk diary runtime

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [Configure, Check, Prepare, Start, Stop, Smoke]
        default: Check
        required: true
      latitude:
        type: string
        default: '37.4878'
      longitude:
        type: string
        default: '127.052'
      radius:
        type: string
        default: '1200'

permissions:
  contents: read
concurrency:
  group: walk-diary-runtime
  cancel-in-progress: false

jobs:
  operate:
    if: ${{ inputs.operation != 'Smoke' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      WALK_OPERATION: ${{ inputs.operation }}
      WALK_LATITUDE: ${{ inputs.latitude }}
      WALK_LONGITUDE: ${{ inputs.longitude }}
      WALK_RADIUS: ${{ inputs.radius }}
      WALK_SGIS_KEY: ${{ secrets.WALK_SGIS_KEY }}
      WALK_SGIS_SECRET: ${{ secrets.WALK_SGIS_SECRET }}
      WALK_PUBLIC_DATA_KEY: ${{ secrets.WALK_PUBLIC_DATA_KEY }}
    steps:
      # No checkout: live backend/src is a bind mount. Operate only on the deployed commit.
      - name: Operate on the existing deployment
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw 'Deploy this exact commit first; runtime control never checks out live source'
          }
          git diff --quiet HEAD -- tools/walk-diary-runtime.ps1 tools/walk_runtime_smoke.py backend/.env.walk-public.example docker-compose.yml backend/src db/migrations
          if ($LASTEXITCODE -ne 0) { throw 'Runtime source has local changes; inspect them first' }
          $culture = [Globalization.CultureInfo]::InvariantCulture
          $lat = [double]::Parse($env:WALK_LATITUDE, $culture)
          $lng = [double]::Parse($env:WALK_LONGITUDE, $culture)
          $radius = [int]::Parse($env:WALK_RADIUS, $culture)
          & .\tools\walk-diary-runtime.ps1 -Action $env:WALK_OPERATION -Latitude $lat -Longitude $lng -Radius $radius

  smoke:
    if: ${{ inputs.operation == 'Smoke' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      # Only the probe is copied. Feature-branch checks must not replace live backend/src.
      - uses: actions/checkout@v5
        with:
          path: _walk-runtime-smoke
          clean: false
      - name: Probe the running application with a disposable account
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Live checkout is missing' }
          Write-Host ('Tested server source: ' + $head)
          $source = Join-Path $env:GITHUB_WORKSPACE '_walk-runtime-smoke\tools\walk_runtime_smoke.py'
          $target = '/tmp/walk-runtime-smoke-' + $env:GITHUB_RUN_ID + '.py'
          try {
            docker cp $source ('daengs-backend:' + $target)
            if ($LASTEXITCODE -ne 0) { throw 'Probe copy failed' }
            docker exec -w /app daengs-backend uv run --no-sync python $target --execute
            if ($LASTEXITCODE -ne 0) { throw 'Walk runtime probe failed' }
          } finally {
            docker exec daengs-backend rm -f $target
          }
