# GCP 전용 설정 (D-042) — docker-compose.gcp.yml 이 default.conf 자리에 마운트합니다.
# 로컬 서버는 default.conf 를 그대로 씁니다. resolver·변수 proxy_pass·접두사 규칙의
# 근거 주석은 default.conf 가 원본입니다. API location 블록은 api-locations.inc 공용.
#
# 서브도메인은 팀 결정(2026-09-01)으로 **클라우드 전용 새 이름**입니다 —
#   daengapp(프런트) · daengapi(백엔드). 기존 daengs·daengback 은 로컬(개발) 서버가
#   그대로 씁니다. 인증서는 둘을 SAN 으로 묶은 한 장이라 경로가 daengapp 쪽 하나입니다
#   (certbot -d 첫 번째 도메인이 폴더 이름이 됩니다 — runbook §4).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=place_search_per_ip:10m rate=5r/s;

resolver 127.0.0.11 ipv6=off valid=10s;

upstream nextjs {
    server host.docker.internal:3000;
}

# ---------------------------------------------------------------------
# 80 — ACME(standalone 발급 때는 nginx 를 내리므로 여기엔 리다이렉트만) → HTTPS
# Android 9+ 는 평문 HTTP 를 기본 차단하므로 80 은 안내용일 뿐입니다.
# ---------------------------------------------------------------------
server {
    listen      80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# 443 — 프론트 (daengapp). default.conf 의 80 블록과 같은 구성 + TLS.
# ---------------------------------------------------------------------
server {
    listen      443 ssl;
    http2       on;
    server_name daengapp.weareithero.cloud;

    ssl_certificate     /etc/letsencrypt/live/daengapp.weareithero.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daengapp.weareithero.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # 프론트와 API 를 같은 오리진으로 (D-015 — httpOnly 쿠키의 전제).
    # HTTPS 가 됐으므로 SameSite=None+Secure 조건도 이제 실제로 충족됩니다.
    location /api/ {
        # set 이 rewrite 보다 먼저 — 근거는 default.conf (#31)
        set $fastapi_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------
# 443 — API (daengapi). 앱에 박히는 주소가 여기입니다.
# ---------------------------------------------------------------------
server {
    listen      443 ssl;
    http2       on;
    server_name daengapi.weareithero.cloud;

    ssl_certificate     /etc/letsencrypt/live/daengapp.weareithero.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daengapp.weareithero.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    include /etc/nginx/conf.d/api-locations.inc;
}

# ---------------------------------------------------------------------
# 8000 — 호스트 내부용 평문 API. 인터넷에는 안 열립니다(GCP 방화벽).
# 호스트에서 도는 Next 의 서버사이드 프록시(NEXT_PUBLIC_API_ORIGIN 기본값
# http://127.0.0.1:8000)가 씁니다 — 이 블록을 지우면 프론트의 /api 경유 호출만
# 깨지고 직접 호출은 멀쩡해서 원인을 찾기 어렵습니다.
# ---------------------------------------------------------------------
server {
    listen      8000;
    server_name _;

    client_max_body_size 20m;

    include /etc/nginx/conf.d/api-locations.inc;
}
