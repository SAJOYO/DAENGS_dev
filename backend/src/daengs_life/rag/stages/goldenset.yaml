  # ------------------------------------------------------------------ 펫보험 5 (RAG-049, origin: hand)
  # 보험 코퍼스 2,067청크(협회 공시 110 · 삼성 약관 1,957)를 재는 첫 문항이다. 이 축은 **같은 질문에
  # 두 층이 따로 답한다** — 협회 공시(`knia-disclosure`)는 담보명·지급액·특이사항이고, 약관(`insurer-terms`)
  # 은 정의·계산식·면책이다 (RAG-038 ②). 그래서 문항을 "공시로도 되는 것"(I1·I2·I5)과 "약관에만 있는
  # 것"(I3·I4)으로 섞었다 — 한 층이 빠지면 어느 문항이 떨어지는지로 **어느 층이 빠졌는지** 보인다.
  #
  # 약관 must 는 **보통약관 조항만** 건다. 특별약관 청크의 주소는 `…특별약관 제1조` 처럼 잘린 특약명에
  # 순번이 붙는 형태라(RAG-041 ⑤) B2(#60)가 경계를 고치면 바뀐다. 그래서 특별약관은 nice 로만 둔다.
  # 강아지 상품(`ZPY008010` 다이렉트 착한펫 2605.1 재가입용)을 must 로, 같은 조항의 다른 판(2601.6 은
  # 조 번호가 다르다 — 보험나이가 제22조, 면책이 제5조)과 위풍댕댕은 nice 로 둔다.
  #
  # "가입 나이 상한" 은 일부러 안 넣었다. 삼성 약관에 그 값이 없어 **물러서는 것이 정답**인데(lap9-age),
  # 이 스키마는 must 가 빈 문항을 허용하지 않는다 (test_every_item_has_a_must). RAG-029 후속이다.

