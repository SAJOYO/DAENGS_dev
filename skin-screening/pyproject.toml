[project]
name = "daengs-skin-screening"
version = "0.1.0"
description = "반려견 피부 병변 스크리닝 보조 — 사진 한 장 → 정상/이상 + 병변 6종 분포. 진단이 아닙니다"
requires-python = ">=3.12,<3.13"

# ─────────────────────────────────────────────────────────────────
# 기본 = **화면과 계약만** 보는 데 필요한 것 (torch 없음).
#
#   uv sync                        → 이만큼 (~30초). serve.py --mock 이 돕니다
#   uv sync --extra model          → torch 까지 (~2GB). 진짜 가중치로 돌릴 때만
#
# torch 를 기본에서 뺀 이유: 앱·백엔드 개발자는 응답 모양만 있으면 붙일 수
# 있고, 진짜 추론은 서버 한 대에서만 돌면 됩니다.
# ─────────────────────────────────────────────────────────────────
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # multipart 업로드 (FastAPI 가 런타임에 요구)
    "Pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.1",               # src/crop.py 가 씁니다
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 진짜 가중치로 돌릴 때만. 가중치(release/)는 이 저장소에 없습니다 — README 참고.
model = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.9",               # 백본 팩토리 (effnetv2_s / convnextv2 / resnet50)
]

[tool.uv]
# src/ 는 `from src import agent` 로 **경로에서 직접** 임포트합니다 (serve.py 가
# 폴더 루트를 sys.path 에 넣습니다). 설치 대상 패키지가 아니라 빌드하지 않습니다.
# ⚠️ backend/ 와 다른 레이아웃입니다 — 여기는 원본 저장소의 사본이라
#    구조를 바꾸면 재동기화가 diff 로 안 됩니다. CLAUDE.md 참고.
package = false
