[project]
name = "daengs-skin-screening"
version = "0.1.0"
description = "반려견 피부 병변 스크리닝 보조 — 사진 한 장 → 정상/이상 + 병변 6종 분포. 진단이 아닙니다"
requires-python = ">=3.12,<3.13"

# ─────────────────────────────────────────────────────────────────
# 기본 = **화면과 계약만** 보는 데 필요한 것 (torch 없음).
#
#   uv sync                        → 이만큼 (~30초). serve.py --mock 이 돕니다
#   uv sync --extra model          → torch 까지 (~2GB). 진짜 가중치로 돌릴 때만
#
# torch 를 기본에서 뺀 이유: 앱·백엔드 개발자는 응답 모양만 있으면 붙일 수
# 있고, 진짜 추론은 서버 한 대에서만 돌면 됩니다.
# ─────────────────────────────────────────────────────────────────
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # multipart 업로드 (FastAPI 가 런타임에 요구)
    "Pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.1",               # src/crop.py 가 씁니다
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 진짜 가중치로 돌릴 때만. 가중치(release/)는 이 저장소에 없습니다 — README 참고.
model = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.9",               # 백본 팩토리 (effnetv2_s / convnextv2 / resnet50)
]

# ─────────────────────────────────────────────────────────────────
# torch 를 어디서 받을지. backend/pyproject.toml 과 같은 장치입니다.
#
# ⚠️ **리눅스를 안 적으면 CUDA 판이 옵니다.** PyPI 의 기본 torch 휠은 NVIDIA
#    런타임을 동봉하고 있어서, 컨테이너가 GPU 를 안 쓰는데도 수 GB 를 받습니다.
#    compose 의 skin-screening 이 리눅스라 여기가 실제로 물리는 자리입니다.
#
# Windows(개발 PC)는 마커에 안 걸려 지금처럼 PyPI 기본에서 받습니다.
# explicit = true 라 아래 [tool.uv.sources] 로 지목한 패키지만 이 인덱스를 씁니다.
# ─────────────────────────────────────────────────────────────────
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# src/ 는 `from src import agent` 로 **경로에서 직접** 임포트합니다 (serve.py 가
# 폴더 루트를 sys.path 에 넣습니다). 설치 대상 패키지가 아니라 빌드하지 않습니다.
# ⚠️ backend/ 와 다른 레이아웃입니다 — 여기는 원본 저장소의 사본이라
#    구조를 바꾸면 재동기화가 diff 로 안 됩니다. CLAUDE.md 참고.
package = false
