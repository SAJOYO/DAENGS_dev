name: walk entry context DB
on:
  pull_request:
    paths:
      - 'backend/src/daengs_backend/**'
      - 'backend/tests/walk/entries/**'
      - 'backend/tests/walk/context/**'
      - 'backend/tests/walk/support/**'
      - 'backend/tests/walk/conftest.py'
      - 'backend/tests/walk/**/conftest.py'
      - 'backend/tests/conftest.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'db/**'
      - '.github/workflows/walk-entry-context-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/daengs_backend/**'
      - 'backend/tests/walk/entries/**'
      - 'backend/tests/walk/context/**'
      - 'backend/tests/walk/support/**'
      - 'backend/tests/walk/conftest.py'
      - 'backend/tests/walk/**/conftest.py'
      - 'backend/tests/conftest.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'db/**'
      - '.github/workflows/walk-entry-context-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: walk_context_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d walk_context_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WALK_CONTEXT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-password@127.0.0.1:5432/walk_context_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q tests/walk/context/test_walk_entry_context_db.py tests/walk/context/test_walk_entry_context.py tests/walk/entries/test_walk_entry_http.py tests/walk/entries/test_walk_entries.py
