# =====================================================================
# 크롤링 시드 소스 목록 (2026-08-19 조사 기준)
# method : api | html | pdf-entry (목록/안내 페이지에서 PDF 수집)
# auth   : none | data-go-kr (활용신청, 자동승인) | law-oc (open.law.go.kr OC 신청)
#          | kma-hub (apihub 가입키) | kakao (REST 키)
# status : verified (2026-08-19 URL/제공여부 확인) | unverified (요확인)
# 상세 설명: docs/data-sources.md, docs/realtime-apis.md
# =====================================================================

# ---------- 공통: 법령 ----------
- id: law-drf-api
  domain: law
  org: 법제처 국가법령정보센터
  title: 국가법령정보 공동활용 Open API (lawSearch/lawService)
  url: "http://www.law.go.kr/DRF/lawSearch.do"
  guide: "https://open.law.go.kr/LSO/openApi/guideResult.do"
  method: api
  auth: law-oc
  status: verified
  notes: "target=law(법령)/ordin(자치법규)/admrul(행정규칙)/expc(해석례)/licbyl(별표서식). 조문 단위 XML 제공"

- id: law-animal-protection
  domain: law
  org: 법제처
  title: 동물보호법 / 시행령 / 시행규칙 (웹 원문)
  url: "https://www.law.go.kr/법령/동물보호법"
  method: html
  auth: none
  status: verified
  notes: "등록(제15조), 안전조치, 맹견(사육허가/입마개/책임보험), 과태료. 시행규칙 제2조에 맹견 5종.
    법/시행령/시행규칙 3건을 함께 받는다.
    (2026-08-20 정찰: 이 URL 은 iframe 껍데기다. iframe src 의 lsiSeq+efYd 로 lsInfoR.do 를 부르면
    조문이 서버 렌더링되어 나온다 — lsInfoP.do 는 AJAX 라 본문이 비어 있다. RAG-011)"

- id: law-livestock-epidemic
  domain: law
  org: 법제처
  title: 가축전염병 예방법 (광견병 예방접종 의무 근거)
  url: "https://www.law.go.kr/법령/가축전염병예방법"
  method: html
  auth: none
  status: verified
  notes: "광견병=제2종 가축전염병, 시장/군수 예방접종 명령. 법/시행령/시행규칙 3건.
    제2종 지정은 시행규칙 제2조, 접종 명령 절차는 하위법령에 있어 셋 다 필요하다.
    (2026-08-20 URL 확인 + 수집 완료. 정식 법령명은 '가축전염병 예방법' 으로 띄어쓰기가 있으나
    붙여쓴 URL 도 law.go.kr 이 받아준다)"

- id: easylaw-pet
  domain: law
  org: 법제처 찾기쉬운 생활법령정보
  title: 반려동물과 생활하기 (종합 해설 - 등록/외출/대중교통/사육)
  url: "https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=1809&ccfNo=1&cciNo=1&cnpClsNo=1"
  method: html
  auth: none
  status: verified
  notes: "법령 조문+해설 통합. 정적 HTML이라 크롤 난도 낮음. Phase 1 최우선.
    본문 7p(CnpClsMain ccfNo/cciNo/cnpClsNo) + 카드뉴스 6p(EasyLawInfoR easySeq 2766~2771).
    URL 목록은 sitemap.xml에서 csmSeq=1809 필터로 얻는다.
    (2026-08-19 정정: 기존 popMenu=ov&csmSeq=1809 단독 URL은 '페이지 오류' 반환)"

