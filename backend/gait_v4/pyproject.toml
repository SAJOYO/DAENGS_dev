[project]
name = "gait-v4"
version = "0.1.0"
description = "walk_demo v4 dog gait analysis (direct SSDlite + RTMPose AP-10K), CPU-only, no DeepLabCut"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "onnxruntime==1.29.0",
    "rtmlib==0.0.16",
    "opencv-python==5.0.0.93",
    "numpy==2.5.2",
    "imageio-ffmpeg==0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gait_v4"]

# CPU 휠 — 이 인덱스에서만 torch/torchvision 을 받는다 (CUDA 불필요, KNOWN_LIMITATIONS·§11-26 스모크와 같은 조합)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
