  # ------------------------------------------------------------------ 경계 6 (RAG-055, origin: hand)
  # **여기부터는 "무엇을 인용했나"가 아니라 "답했나 말았나"를 재는 문항이다.** 로드맵 §2 의 신호 표가
  # Life 에 요구하는 것 — 근거가 약하면 기권(ABSTAINED), 이 개의 몸에 대한 판단이면 거절(REFUSED) —
  # 을 골든셋에서 잴 자리이고, A0 스모크(#169)가 그 둘이 지금 하나도 안 난다는 것을 실물로 보여 줬다.
  #
  # 질문은 전부 **합성 문장**이다 — D-037 이 금하는 것은 사용자 원문이고, B1·B2 는 A0 이 실제로 던진
  # 스모크 문장 그대로다 (`docs/life/assistant-life-gcp-smoke.md` §2 의 ①-1 · ③).
  #
  # ⚠ **B1 이 이 묶음에서 유일하게 `answer` 인 것이 의도다.** 기권 신호는 넣기는 쉽고 **과하게 켜지기가**
  # 더 쉽다 — 약한 근거를 잡겠다고 문턱을 올리면 답할 수 있는 질문까지 접힌다. B1 이 그 반대편 자다.

  - id: B1
    added_on: 2026-09-03
    origin: hand
    question: 목줄 안 하면 과태료 얼마야
    # A0 ①-1 그대로다. Q3 과 같은 것을 묻는 **구어체**이고 라벨도 같다 — 코퍼스에 답이 있으므로
    # (test_q3_label_reaches_the_fine_amount 가 "50만원 이하의 과태료"에 닿는 것을 붙잡는다)
    # 기대는 `answer` 다. GCP 에서는 "자료에 포함되어 있지 않습니다" 산문에 무관한 과태료를 붙여
    # `cited == []` 로 나갔다 (§3-1). 그것은 답이 아니지만 **기권으로 접어서도 안 된다** —
    # 접으면 이 문항이 실패로 잡히고, 그것이 이 문항이 여기 있는 이유다
    must:
      - - law-drf-api-animal-protection-act#제16조        # ②1호 안전조치 의무
      # Q3 과 같은 대안을 같이 넣는다 (RAG-061 ①). 두 문항은 같은 것을 묻는 구어체/문어체 쌍이라
      # 라벨이 갈리면 그 둘의 차이가 문체가 아니라 라벨 때문이 된다
      - - law-drf-api-animal-protection-act#제101조④      # ④4호 50만원 이하 — 위임 조항
        - law-drf-api-animal-protection-decree#별표 4-2-아  # 20·30·50 — 금액이 실제로 있는 곳
    nice:
      - easylaw-pet-2-2-1#h2-1                           # 반려견 목줄 등 안전조치하기
    unavailable: []

