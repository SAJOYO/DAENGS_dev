    origin: hand
    question: 목줄 안 하면 과태료 얼마인가요?
    must:
      - law-drf-api-animal-protection-act#제16조          # ②1호 안전조치 의무 — 인용의 근거
      - law-drf-api-animal-protection-act#제101조④        # ④4호 50만원 이하 — 금액. 검문소① 라벨에는 없었다
    nice:
