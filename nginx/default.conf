# WebSocket 업그레이드용 매핑.
# Upgrade 헤더가 있으면 "upgrade", 없으면 "close" 를 Connection 에 넣습니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 호스트(이 PC)에서 PM2 로 돌고 있는 Next 서버.
upstream nextjs {
    server host.docker.internal:3000;
}

server {
    listen      80;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 통과 (개발 중 HMR, 향후 실시간 기능)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # 프론트와 API 를 같은 오리진으로 묶습니다.
    # /api/auth/login 요청이 백엔드의 /auth/login 으로 전달됩니다
    # (proxy_pass 끝의 / 가 /api 접두사를 떼어 냅니다).
    #
    # **이 블록이 로그인의 전제입니다** (D-015). daengs.~(:80) 와 daengback.~(:8000) 은
    # 브라우저에게 다른 오리진이라 httpOnly 쿠키가 그냥은 실리지 않습니다.
    # 오리진을 유지한 채 쿠키를 보내려면 SameSite=None + Secure 라 HTTPS 가 필수인데
    # 지금은 http 입니다. 여기로 묶어서 같은 오리진을 만드는 것이 답입니다.
    #
    # daengback.~(:8000) 은 그대로 둡니다. 앱·외부 클라이언트가 쓰는 길이고,
    # 그쪽은 쿠키가 아니라 Authorization: Bearer 를 씁니다.
    location /api/ {
        # host.docker.internal 이 아닙니다. backend 는 이제 compose 서비스라
        # 같은 네트워크에서 이름으로 바로 닿습니다 (아래 upstream fastapi).
        proxy_pass http://fastapi/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 로그인 실패 횟수를 이 값으로 셉니다 (services/login_attempts.py).
        # $remote_addr 로 **덮어쓰는** 것이 중요합니다 — 클라이언트가 같은 이름의
        # 헤더를 보내도 여기서 지워지므로 위조할 수 없습니다.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 중에는 uvicorn 이 리로드로 잠깐 내려갈 수 있습니다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------
# daengback.~  (서버 PC 의 8000 포트로 포워딩됨)
#
# backend 컨테이너는 포트를 열지 않습니다. 여기를 통해서만 들어옵니다.
# 같은 compose 네트워크라 서비스 이름으로 바로 붙습니다.
# ---------------------------------------------------------------------
upstream fastapi {
    server backend:8000;
}

server {
    listen      8000;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 중에는 uvicorn 이 리로드로 잠깐 내려갈 수 있습니다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
