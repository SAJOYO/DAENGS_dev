# 골든셋 시드 (RAG-022) — 6단계 3파전과 8단계 검문소③이 이 파일로 채점된다.
#
# 라벨에는 **수집 날짜를 뺀 논리 주소**를 적는다 (RAG-022 ⑥B). 실제 chunk_id 는
# `law-drf-api-...-act__20260820#제15조` 이지만 `__20260820` 은 수집일이라 재수집하면 바뀐다.
# 채점기가 `__\d{8}` 를 벗겨 대조하므로 여기서는 날짜 없이 적는다.
#
# must  = 없으면 최종 답변이 틀리는 청크. Recall 의 분자·분모가 이것이다.
#         **항목 하나가 요구 하나**이고, 항목을 목록으로 적으면 그 안은 OR 다 (RAG-055) —
#         어느 대안 하나만 있어도 그 요구가 채워진다. 문자열 하나는 원소 하나짜리 목록과 같아
#         옛 라벨이 그대로 읽힌다. **대안을 늘려도 요구 수(=Recall 분모)는 안 변한다**
# nice  = 있으면 인용이 단단해지지만 없어도 답이 성립. 점수에 들어가지 않는다
# unavailable = 코퍼스 밖 참조. **분모에서 뺀다** — 세 모델이 같은 코퍼스를 쓰므로 모델 차이가 아니다.
#               적어 두는 이유는 그 법령을 수집하면 must 로 올라가야 하기 때문이다
# expect = 이 문항에 기대하는 것 (RAG-055). 없으면 `answer` — 지금까지의 전부가 그것이다.
#          `abstain` 은 물러서는 것이 정답, `refuse` 는 거절이 정답이고 둘 다 must/nice 가 비어야 한다

schema_version: 2

corpus:                            # 이 라벨을 판정한 코퍼스 스냅샷. 다르면 채점기가 경고한다
  # 2026-08-27 재수집으로 갱신 (RAG-030). 라벨은 다시 쓰지 않았다 — **개정이 없었기** 때문이다:
  # 요소 합계(article 629 · heading 97 · 서식 제외 126)와 청크 총량·제외 내역이 1랩과 같고,
  # 조문 내용을 박아 둔 test_parse.py 19개 · test_chunk.py 27개가 전부 통과했다.
  # 2026-08-27 해설 소스 4건(gov24 · nias · 정책브리핑 · 서울시) 68청크가 더해져 1407 -> 1475.
  # 2026-08-28 조례 208건(RAG-033) + 보조금24 37건(RAG-034) + 코레일 약관 2건(RAG-036).
  # **셋 다 라벨을 손대지 않았다** — 더해진 것이 전부 새 문서라 기존 라벨이 가리키는 청크의
  # 주소가 안 바뀐다. 이 값은 "라벨을 판정한 코퍼스"의 표식이지 정답이 아니라, 소스가 늘 때마다
  # 다시 세면 된다.
  # 2026-08-28 손해보험협회 공시 7건(RAG-038) + 운송약관 HTML 3건(RAG-039)이 더해졌다.
  # 여기도 라벨을 손대지 않았다 — 전부 새 문서다.
  # 2026-08-29 삼성화재 약관 PDF 11건(RAG-041) 1,957청크. **#53 이 이 줄을 안 고쳤다** —
  # 4411 은 RAG-039 까지의 값이었다 (RAG-042 ③). 라벨은 여기서도 안 건드렸다.
  #
  # ⚠ **이 값은 `test_chunk.py` 의 `BY_SOURCE` 합계와 같아야 한다** — 저기는 parsed 를 그 자리에서
  # 청킹한 수고 여기는 `chunks/*.jsonl` 에 적재된 수라, 둘이 다르면 재청킹이 덜 됐다는 뜻이다.
  #
  # ⚠ **DB 행 수와 같아지는 값이 아니다.** 2026-08-29 까지 여기 "서버 DB 적재분과 일치 확인"
  # 이라고 적혀 있었는데 틀린 말이었다 (#69 가 정정, RAG-046 에서 확인). 바른 불변식은:
  #
  #     chunk_count == BY_SOURCE 합계 == chunks/*.jsonl 의 **콘텐츠 행** 수
  #     DB documents 행 수 == chunk_count − prepare().merged − (아직 적재 안 한 청크)
  #
  # 실측 2026-08-30: 청크 6,389 · merged 112 · 항공 21 은 아직 적재 전 → DB 6,256. 셋이 맞는다.
  # ("콘텐츠 행"인 이유는 파일마다 첫 줄이 헤더여서다 — 날 것으로 세면 306줄이 더 나온다.)
  #
  # 옛 적재가 남아 6,414 로 세어지던 것(RAG-042 ⑤)은 **이제 아니다** — #69 가 `rag load --prune`
  # 으로 393행을 지워 DB 가 `prepare()` 와 정확히 같아졌다 (RAG-045 ①).
  #
  # 두 자리를 손으로 맞추고 있는 것이 어긋남의 원인이므로 **한 자리로 모으는 것이 남은 일이다**
  # (RAG-042 ③ — `BY_SOURCE` 를 패키지 안으로 옮기고 여기서 파생시킨다).
  # 2026-08-29 항공 2건(RAG-046, #57) 21청크가 더해져 6368 -> 6389. **라벨은 안 건드렸다** —
  # 전부 새 문서라 기존 라벨이 가리키는 청크의 주소가 안 바뀐다. 항공 문항 자체는 B1(#59) 몫이다
  # (이 카드의 메모 ⑤ — 그쪽이 `unavailable` 로 뒀다가 이 카드가 머지되면 `must` 로 올린다).
  # 2026-08-30 KB·농협 약관 12건(RAG-048, #58) 3,062청크가 더해져 6389 -> 9451. **라벨은 안 건드렸다** —
  # 삼성 11건은 청크 id 가 그대로이고(쪽 번호 줄만 빠졌다) 보험 문항은 아직 없다 (B1 #59 몫).
  # 2026-09-06 음식·주거 9건(RAG-065, #268) 853청크가 더해져 9451 -> 10304.
  # **기존 라벨은 안 건드렸다** — 더해진 것이 전부 새 문서라 옛 라벨의 주소가 안 바뀐다.
  # 다만 `nias-pet` 7장은 **다시 청킹됐다**(파서 VERSION 2 — 탭 메뉴를 noise 로 뺐다).
  # 그 7장에는 탭이 없어 결과는 같고, 청크 42개의 id·내용이 그대로임을 증분 임베딩이
  # 확인했다 — 재사용 9,451 · 인코딩 853 · 사라짐 0 이라 옛 행이 하나도 안 바뀌었다.
