; No sqlalchemy.url here: alembic/env.py reads it from app.core.config.settings.
; ASCII only. ConfigParser reads this file with the locale encoding, which is cp949 on a
; Korean Windows shell -- a non-ASCII byte here makes every alembic command fail there.
; Korean notes live in alembic/env.py, which is read as UTF-8.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
