    (GET, 같은 쿼리, 225KB). content-type 은 text/plain 인데 **JSON 이 아니라 JS 객체 리터럴**이다
    (키 무따옴표·값 홑따옴표) — json.loads 로 안 열리니 파서를 따로 써야 한다.
    필드: TP_NAME(상품명) P_CODE_NM(회사) TP_ETC(특이사항·자기부담금·할인조건)
    TP_PAY_NAME/TP_PAY_REASON(담보명·지급사유) TP_W_BILL/TP_M_BILL(보험료)
    TP_URL(회사 공시실 딥링크) SUMMARY_SEQ(상품요약서).
    ⚠ **약관 원문은 없다** — 보장내용·지급기준·이율의 비교 수치다. insurer-terms-pdfs 를 대체하지 못하고 보완한다.
    ⚠ **회사가 7사다** (메리츠 N01 · 삼성 N08 · 현대 N09 · KB N10 · DB N11 · 카카오페이 N70 · 농협 N71).
    한화·롯데·캐롯은 이 공시에 없고, 대신 **카카오페이손해보험이 있다** — 시드의 9사 목록이 어긋나 있었다."

- id: insurer-terms-pdfs
  domain: insurance
  org: 각 손해보험사
  title: 상품공시실 약관 PDF (펫보험 판매사)
  # 삼성 목록 엔드포인트. 회사마다 다르므로 소스 모듈의 어댑터가 자기 것을 안다 (RAG-039 ①)
  url: "https://www.samsungfire.com/vh/sfmi/ui/wshomepage/search/search_law_xml.jsp"
  method: pdf-entry
  auth: none
  status: verified
  notes: "2026-08-28 정찰: 삼성화재 약관 PDF 를 실제로 받아 파서 비교에 썼다(202p, 11.8MB, 텍스트 레이어 있음).
    예: /publication/pdf/ZPB316050_0_20240401_file1.pdf (위풍댕댕).
    robots — 삼성화재·NH농협 전면 허용, 현대해상·롯데·캐롯 일부 경로만 차단, 메리츠는 robots 가 HTML,
    DB손보·한화손보는 User-agent 줄 없는 allow-list(표준상 그룹 밖 규칙은 무시되지만 의도는 제한이다),
    KB손보는 Yeti(네이버) 그룹만 있다.
    2026-08-28 정찰(#50) — **딥링크를 knia 가 준다** (disclosureList.do 의 TP_URL). 손으로 찾을 필요가 없었다:
      메리츠  https://www.meritzfire.com/disclosure/product-announcement/product-list.do
      삼성    https://www.samsungfire.com/vh/page/VH.REIF0011.do  (VH.HPIF0103.do 로 리다이렉트)
      현대    https://www.hi.co.kr/bin/CI/ON/CION3200G.jsp        🚫 **robots 차단** (그 `일부 경로`가 이 경로다)
      KB      http://www.kbinsure.co.kr/CG802030001.ec · /CG803000012.ec
      DB      https://www.idbins.com/FWMAIV1534.do
      농협    https://www.nhfire.co.kr/announce/productAnnounce/retrieveInsuranceProductsAnnounce.nhfire
      카카오페이 https://kakaopayinscorp.co.kr/products/pet
    ⚠ **8개 중 약관 PDF 링크를 초기 HTML 로 주는 곳이 하나도 없다.** 상품표가 전부 AJAX 이고
    (DB 406KB·농협 362KB 는 대부분 전역 네비게이션이다), 엔드포인트가 사별로 달라 **사마다 따로 역추적**해야 한다.
    카카오페이·메리츠는 SPA 껍데기(805B·hash 라우팅)라 정적 수집으로는 목록조차 안 나온다.
    ✅ 시드에 적힌 삼성 PDF 는 아직 산다 — 200, 11,870,258B(11.3MB), `%PDF-`. 202p.
    ⚠ 회사 목록 정정: 이 도메인의 판매사는 **7사**이고 한화·롯데·캐롯이 아니라 **카카오페이손보**가 들어간다 (knia PB27 기준).
    2026-08-29 수집(#53 · RAG-039) — **삼성 완료.** 목록은 공시실 SPA 가 아니라 그 페이지의 스크립트
    (`/sfmi/v2/ui/info/IH_IF_Terms.js`)에 적힌 `search_law_xml.jsp` 가 준다. JS 는 POST 로 부르지만
    **GET 도 같은 XML** 을 줘서 Fetcher 를 안 고쳤다. XML 이 PDF 경로를 직접 준다
    (n_policy=약관 / n_method=사업방법서 / n_summary=상품요약서). SearchNlawResult=판매중만 받는다.
    ⚠ kwd 하나로는 다 안 걸린다 — `펫`은 반려묘보험을, `반려묘`는 착한펫보험을 놓친다. 네 키워드 합집합으로 11건.
    ⚠ 회사 공시실(11건)이 협회 공시(6건)보다 넓다.
    ⚠ **약관 PDF 한 파일에 관계법령 전문이 붙어 있다** — 안 자르면 신용정보법 조문이 `펫보험 약관 제32조`로
    인용된다. 앞의 안내 책자와 뒤의 별표·관계법령을 잘라낸다 (RAG-039 ②).
    실측 11건 25.1MB · 1,530쪽 · 스캔 0건(0자 페이지 1.2%). 남은 6사는 별도 카드.
    2026-08-30 수집(#58 · RAG-048) — **KB 9건 · 농협 3건 완료.** 합계 23건.
    KB: 목록 POST 폼이 GET 을 받되 조건은 hidden 이 아니라 화면 입력 필드(search_goods_nm · search_onsale_yn, euc-kr).
      상세가 판매 이력 표라 판매종료일 빈 행의 약관 링크(/CG802030003.ec?fileNm=…)를 읽는다 — 조립하지 않는다.
      ⚠ 25200(다이렉트 금쪽같은 펫보험 고양이 재가입용)은 약관 자리에 8쪽 특이사항(_1_3.pdf)이 걸려 있어 건너뛴다.
    농협: ajax 세 단 GET (retrievePdtCd → retrievePdtInfo?fileType=05 → /imageView/downloadFile.ajax). 1·2·3종이 합본 한 PDF.
    ⚠ **DB손보는 뺐다** — robots 가 User-agent 없는 allow-list + Disallow: / 이고 공시실 경로가 allow-list 에 없다.
      표준상 통과하지만 의도를 존중한다 (사람이 정함, RAG-048 ①).
    ⚠ 마커는 회사가 아니라 판형이 정한다 — KB 구형(2018)은 농협처럼 얇은 표제 없이 바로 제1조(목적)다 (RAG-048 ④)."

