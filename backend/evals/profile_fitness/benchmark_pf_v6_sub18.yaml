# 개체 적합성 — general 프롬프트 v3 → v6 전후 비교. 사전 등록 (수집 전에 동결).
#
# 왜 (2026-09-11): dev 가 general 프롬프트를 v6 로 올렸다 (D-068). 새 규칙 "프로필은 사용자가 물었거나 안전한 조언이
# 달라질 때만 써라. 견종·나이를 뿌리지 마라". 우리 시험 ①이 v3 위에서 잰 P 59% · S 43% 가 어떻게 움직였는지 본다 —
# 판정기가 실무에서 쓰이는 첫 장면(프롬프트 바꾼 뒤 개인화가 살았나 죽었나).
#
# 예상을 먼저 적는다: P 는 내려갈 수 있다(억제 규칙), S 는 내려가야 한다(뿌리지 말라). 둘 다 내려가면 규칙이 통째로
# 개인화를 죽인 것이고, S 만 내려가면 규칙이 의도대로 든 것이다. 어느 쪽이든 그게 결과다 — 기준을 옮기지 않는다.
benchmark_id: profile-fitness-v6-sub18
related: profile-fitness-v1.1          # 같은 18문항의 v3 판정(v2.1a)과 쌍 단위로 비교
frozen_at: 2026-09-11
author: gayeoniee + claude

target: POST /assistant/query 최종 답변 (message)
scope:
  capability: general
  adapters: fallback-only
  general_fallback: on
  conditions: [contrast, ablation]     # 잡음 N 은 뺐다 — v1.1 에서 0% 확정, general 은 온도 0 결정론. 예산.

inputs:
  questions: evals/profile_fitness/questions_pf_v1_1_sub18.jsonl   # v1.1 의 reactive coarse 10 + invariant 8 (패러프레이즈 제외)
  profiles: evals/profile_fitness/profiles_v1.jsonl
  questions_sha256: 363259cb76fcd88c2d3bee1228dd9832a445cd8de2866cb763580a42e0ccd4d8
  profiles_sha256: 061c04495434e6e5c2112422aa52b27cd4b06604fe85a212cca3d70b523b6c73

generation:
  router: {model: gemini-3.1-flash-lite, prompt_version: semantic-router-ko-v10}
  general: {model: gemini-3.1-flash-lite, prompt_version: general-answer-ko-v6}
judge:
  model: gpt-5.4-2026-03-05
  prompt_versions: {A: profile-fitness-diff-ko-v2.1a}
  temperature: 0.0
  both_orders: false                  # 예산 5만. --both-orders-sample 0 을 명령에 실제로 준다 (Life 때 빼먹은 것)

judge_gates: {anchors_dev: all_pass, anchors_holdout: all_pass}
metric_gates:
  inequality: S < P                   # N 없음
  ablation_changed_min: 0.60
  invariant_changed_max: 0.30
  unmeasured_max: 0.05
sample: {reactive: 10, invariant: 8}
budget: {cells: 52, pairs: 28, judge_tokens_max: 50000}
