benchmark_id: orchestration-router-v1
phase: 1
execution_authorized: false
prompt_version: semantic-router-ko-v1
model: gemini-3.5-flash-lite
locale: ko-KR
scored_case_count: 80

retry:
  max_attempts: 2
  retry_on: schema_validation_error
  retry_semantic_misroute: false

metrics:
  - first_pass_schema_valid_rate
  - retry_recovery_count
  - final_schema_valid_rate
  - unrecovered_schema_failure_count
  - exact_route_plan_match
  - executable_precision
  - executable_recall
  - training_precision
  - training_recall
  - life_precision
  - life_recall
  - walk_precision
  - walk_recall
  - multi_execute_recall
  - exact_executable_set_accuracy_multi
  - handoff_precision
  - handoff_recall
  - skin_handoff_recall
  - gait_handoff_recall
  - exact_mixed_execute_handoff_match
  - clarify_precision
  - clarify_recall
  - false_positive_clarify_rate
  - forbidden_execute_count
  - invented_unsupported_capability_count

acceptance_gates:
  final_schema_valid_rate: 1.0
  first_pass_schema_valid_rate: 0.975
  forbidden_execute_count: 0
  invented_unsupported_capability_count: 0
  exact_route_plan_match: 0.90
  executable_precision: 0.95
  executable_recall: 0.95
  multi_execute_recall: 0.90
  exact_executable_set_accuracy_multi: 0.90
  skin_handoff_recall: 1.0
  gait_handoff_recall: 1.0
  handoff_precision: 0.95
  exact_mixed_execute_handoff_match: 0.90
  clarify_precision: 0.90
  clarify_recall: 0.90

performance:
  latency_ms: true
  warm_p50: true
  warm_p95: true
  input_tokens: true
  output_tokens: true
  total_tokens: true
  acceptance_gate: false
